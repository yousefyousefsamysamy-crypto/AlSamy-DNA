<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مركز السامي — نتايج التدريب</title>
<style>
/* لوحة عمل، مش صفحة للقراءة: الأهم إن الصف يتقرا بسرعة وإن اللي محتاج
   انتباهك يبان من غير ما تدوّر عليه. */
:root{
  --bg:#F4F2EC; --surface:#fff; --line:#E6E3DA; --ink:#2C2A25; --ink-2:#5C6570; --ink-3:#8A9199;
  --good:#2E9E7E; --warn:#C98A22; --crit:#C43D57; --accent:#2F3B45;
  --r:14px; --shadow:0 1px 2px rgba(44,42,37,.05), 0 14px 32px -22px rgba(44,42,37,.4);
}
*{box-sizing:border-box}
/* An explicit display in a rule beats the browser's own [hidden]{display:none},
   so hiding a grid/flex element by attribute silently does nothing without this. */
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:14px;line-height:1.7}
.wrap{max-width:1080px;margin:0 auto;padding:24px 16px 60px}

/* ── بوابة الدخول ── */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.gate-c{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);
  border-radius:18px;padding:30px 28px;box-shadow:var(--shadow)}
.gate-c p.k{font-size:11px;color:var(--ink-3);margin:0 0 6px}
.gate-c h1{font-size:19px;margin:0 0 4px;line-height:1.6}
.gate-c p.s{font-size:13px;color:var(--ink-2);margin:0 0 20px}
label{display:block;font-size:12.5px;font-weight:600;margin-bottom:7px}
input[type=password],input[type=search]{width:100%;font:inherit;font-size:15px;padding:11px 14px;
  border:1px solid #DDE0E3;border-radius:11px;background:#fff}
input:focus{outline:2px solid #3E6B85;outline-offset:1px;border-color:#3E6B85}
button{font:inherit;cursor:pointer}
.btn{width:100%;margin-top:12px;font-size:14.5px;font-weight:600;color:#fff;background:var(--accent);
  border:0;border-radius:11px;padding:12px}
.btn:disabled{opacity:.6;cursor:default}
.err{font-size:12.5px;color:var(--crit);margin:10px 0 0;display:none}.err.on{display:block}

/* ── الرأس ── */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:21px;margin:0}
.top p{margin:2px 0 0;font-size:12.5px;color:var(--ink-3)}
.top-a{display:flex;gap:8px;align-items:center}
.ghost{font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--surface);
  border:1px solid var(--line);border-radius:9px;padding:8px 14px}
.ghost:hover{border-color:#C9CCD1}

/* ── الملخص ── */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tile span{display:block;font-size:11.5px;color:var(--ink-3)}
.tile b{display:block;font-size:24px;font-weight:700;line-height:1.35;font-variant-numeric:tabular-nums}

/* ── الأدوات ── */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools input[type=search]{flex:1;min-width:190px;font-size:14px;padding:9px 13px}
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{font-size:12.5px;font-weight:600;color:var(--ink-2);background:none;border:0;
  border-radius:7px;padding:6px 12px}
.seg button.on{background:var(--accent);color:#fff}

/* ── الجدول ── */
.tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  overflow-x:auto;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;min-width:720px}
th{text-align:start;font-size:11.5px;font-weight:600;color:var(--ink-3);
  padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 14px;border-bottom:1px solid #F0EEE8;font-size:13.5px;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:#FAF9F6}
.nm{font-weight:600}
.sub{display:block;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;direction:ltr;text-align:start}
.pc{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 10px;border-radius:99px;white-space:nowrap}
.p-good{background:#E4F3ED;color:#1F6B53}
.p-warn{background:#FBF0DC;color:#8A5D12}
.p-crit{background:#FBE7EA;color:#96253C}
.p-mute{background:#EFEEE9;color:#6E767F}
.flags{display:flex;gap:5px;flex-wrap:wrap}
.empty{padding:44px 20px;text-align:center;color:var(--ink-3);font-size:13.5px}
@media (max-width:560px){ .wrap{padding:16px 12px 48px} .top h1{font-size:19px} }
</style>
</head>
<body>

<div class="gate" id="gate">
  <form class="gate-c" id="gf">
    <p class="k">مركز السامي</p>
    <h1>نتايج التدريب</h1>
    <p class="s">الصفحة دي للإدارة بس.</p>
    <label for="pw">باسورد الإدارة</label>
    <input id="pw" type="password" autocomplete="current-password" dir="ltr">
    <button class="btn" id="gb" type="submit">ادخل</button>
    <p class="err" id="ge"></p>
  </form>
</div>

<div class="wrap" id="app" hidden>
  <div class="top">
    <div>
      <h1>نتايج التدريب</h1>
      <p id="meta"></p>
    </div>
    <div class="top-a">
      <button class="ghost" id="csv">نزّل الجدول Excel</button>
      <button class="ghost" id="out">اقفل</button>
    </div>
  </div>

  <div class="tiles" id="tiles"></div>

  <div class="tools">
    <input type="search" id="q" placeholder="دوّر باسم أو رقم موبايل…">
    <div class="seg" id="filt">
      <button data-f="all" class="on">الكل</button>
      <button data-f="crit">فيها أخطاء حرجة</button>
      <button data-f="written">محتاجة تقييم يدوي</button>
    </div>
  </div>

  <div class="tbl-wrap">
    <table>
      <thead><tr>
        <th>الاسم</th><th>النتيجة</th><th>التقدير</th><th>ملاحظات</th>
        <th>المحاولة</th><th>المدة</th><th>التاريخ</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>لسه مفيش نتايج.</div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var KEYNAME = 'sami-admin-key';
  var ROWS = [], F = 'all', Q = '';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;'); };

  /* الباسورد بيتبعت مع كل طلب ومش بيتحفظ غير في التاب ده — بمجرد ما تقفل
     التاب بيروح، فمحدش يفتح الجهاز بعديك ويلاقي الصفحة مفتوحة. */
  function key() { try { return sessionStorage.getItem(KEYNAME) || ''; } catch (e) { return ''; } }
  function api(path) {
    return fetch(path, { headers: { 'x-admin-key': key() }, cache: 'no-store' })
      .then(function (r) {
        if (r.status === 401) throw new Error('unauth');
        return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'خطأ'); return j; });
      });
  }

  var BAND = { strongFit: ['مناسب بقوة', 'p-good'], promising: ['واعد', 'p-good'],
               needsTraining: ['محتاج تدريب', 'p-warn'], concerns: ['فيه ملاحظات', 'p-crit'] };

  function fmt(iso) {
    if (!iso) return '—';
    try { return new Intl.DateTimeFormat('ar-EG-u-nu-latn',
      { dateStyle: 'medium', timeStyle: 'short' }).format(new Date(iso)); }
    catch (e) { return iso; }
  }

  function visible() {
    var q = Q.trim().toLowerCase();
    return ROWS.filter(function (r) {
      if (F === 'crit' && !r.critical) return false;
      if (F === 'written' && !r.written) return false;
      if (!q) return true;
      return (r.name || '').toLowerCase().indexOf(q) >= 0 ||
             String(r.phone || '').indexOf(q) >= 0;
    });
  }

  function paint() {
    var v = visible();
    $('rows').innerHTML = v.map(function (r) {
      var band = BAND[r.band] || ['—', 'p-mute'];
      var col = r.percent >= 70 ? 'var(--good)' : r.percent >= 55 ? 'var(--warn)' : 'var(--crit)';
      var flags = '';
      if (r.critical) flags += '<span class="pill p-crit">' + r.critical + ' خطأ حرج</span>';
      if (r.written) flags += '<span class="pill p-mute">' + r.written + ' سؤال مكتوب</span>';
      return '<tr data-id="' + esc(r.id) + '">' +
        '<td><span class="nm">' + esc(r.name) + '</span>' +
          '<span class="sub">' + esc(r.phone || '') + '</span></td>' +
        '<td><span class="pc" style="color:' + col + '">' + r.percent + '%</span></td>' +
        '<td><span class="pill ' + band[1] + '">' + band[0] + '</span></td>' +
        '<td><div class="flags">' + (flags || '<span class="sub">—</span>') + '</div></td>' +
        '<td style="font-variant-numeric:tabular-nums">' + r.attempt + '</td>' +
        '<td style="font-variant-numeric:tabular-nums">' + Math.round((r.duration_s || 0) / 60) + ' د</td>' +
        '<td><span class="sub">' + esc(fmt(r.completed_at)) + '</span></td>' +
      '</tr>';
    }).join('');
    $('empty').hidden = v.length > 0;
    $('empty').textContent = ROWS.length ? 'مفيش نتيجة مطابقة للبحث.' : 'لسه مفيش نتايج.';

    var n = ROWS.length;
    var avg = n ? Math.round(ROWS.reduce(function (s, r) { return s + (r.percent || 0); }, 0) / n) : 0;
    var crit = ROWS.filter(function (r) { return r.critical; }).length;
    var wr = ROWS.filter(function (r) { return r.written; }).length;
    $('tiles').innerHTML =
      tile('كل النتايج', n) +
      tile('متوسط النتيجة', avg + '%') +
      tile('فيها أخطاء حرجة', crit, crit ? 'var(--crit)' : '') +
      tile('محتاجة تقييم يدوي', wr, wr ? 'var(--warn)' : '');
    $('meta').textContent = n + ' نتيجة · آخر تحديث ' + fmt(new Date().toISOString());
  }
  function tile(label, val, col) {
    return '<div class="tile"><span>' + label + '</span><b' +
      (col ? ' style="color:' + col + '"' : '') + '>' + val + '</b></div>';
  }

  function load() {
    return api('/api/list').then(function (j) { ROWS = j.rows || []; paint(); });
  }

  /* فتح تقرير: التاب بيتفتح الأول فورًا مع الدوسة — لو استنينا رد السيرفر
     الأول، المتصفح بيعتبرها نافذة منبثقة ويمنعها. */
  function open(id) {
    var w = window.open('', '_blank');
    if (!w) { alert('المتصفح منع فتح نافذة جديدة. اسمحله بالنوافذ المنبثقة للموقع ده.'); return; }
    w.document.write('<!doctype html><meta charset="utf-8"><title>بيفتح…</title>' +
      '<body style="font-family:system-ui;display:grid;place-items:center;height:90vh;color:#8A9199">' +
      'بنفتح التقرير…</body>');
    api('/api/report?id=' + encodeURIComponent(id)).then(function (j) {
      if (!j.html) { w.document.body.textContent = 'التقرير ده مش متخزن كصفحة. نزّله كـ JSON من الجدول.'; return; }
      w.document.open(); w.document.write(j.html); w.document.close();
    }).catch(function (e) {
      w.document.body.textContent = e.message === 'unauth' ? 'الجلسة انتهت — اقفل وادخل تاني.' : 'ما قدرناش نفتح التقرير.';
    });
  }

  function csv() {
    var head = ['الاسم', 'الموبايل', 'العنوان', 'النتيجة', 'التقدير', 'أخطاء حرجة',
                'أسئلة مكتوبة', 'المحاولة', 'المدة بالدقايق', 'التاريخ'];
    var lines = [head].concat(visible().map(function (r) {
      return [r.name, r.phone, r.address, r.percent, (BAND[r.band] || ['—'])[0],
              r.critical, r.written, r.attempt, Math.round((r.duration_s || 0) / 60), r.completed_at];
    })).map(function (row) {
      return row.map(function (c) { return '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"'; }).join(',');
    }).join('\r\n');
    // ﻿ عشان إكسل يقرا العربي صح.
    var blob = new Blob(['﻿' + lines], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'AlSami-results-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
  }

  function enter() { $('gate').hidden = true; $('app').hidden = false; }
  function leave(msg) {
    try { sessionStorage.removeItem(KEYNAME); } catch (e) {}
    $('app').hidden = true; $('gate').hidden = false;
    $('pw').value = ''; $('pw').focus();
    if (msg) { $('ge').textContent = msg; $('ge').className = 'err on'; }
  }

  $('gf').addEventListener('submit', function (e) {
    e.preventDefault();
    $('ge').className = 'err'; $('gb').disabled = true; $('gb').textContent = 'بيتأكد…';
    try { sessionStorage.setItem(KEYNAME, $('pw').value); } catch (err) {}
    load().then(function () { enter(); })
      .catch(function (err) {
        try { sessionStorage.removeItem(KEYNAME); } catch (e2) {}
        $('ge').textContent = err.message === 'unauth' ? 'الباسورد غلط.' : err.message;
        $('ge').className = 'err on';
      })
      .then(function () { $('gb').disabled = false; $('gb').textContent = 'ادخل'; });
  });

  $('rows').addEventListener('click', function (e) {
    var tr = e.target.closest('tr[data-id]');
    if (tr) open(tr.getAttribute('data-id'));
  });
  $('q').addEventListener('input', function () { Q = this.value; paint(); });
  $('filt').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    [].forEach.call(this.querySelectorAll('button'), function (x) { x.classList.remove('on'); });
    b.classList.add('on'); F = b.getAttribute('data-f'); paint();
  });
  $('csv').addEventListener('click', csv);
  $('out').addEventListener('click', function () { leave(''); });

  // لو التاب لسه فاتح من شوية، مش محتاج يكتب الباسورد تاني.
  if (key()) load().then(enter).catch(function () { leave(''); });
  else $('pw').focus();
})();
</script>
</body>
</html>
