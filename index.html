<html lang="ar" dir="rtl">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   لينكات الفيديو — عدّل هنا وبس
   ───────────────────────────────────────────────────────────────────────────
   حط لينك الفيديو جوّه علامتي التنصيص قدام الوحدة اللي هو بتاعها، واحفظ الملف
   وارفعه تاني. الوحدة اللي لينكها فاضي مش هيظهر فيها فيديو خالص — الوحدة
   بتشتغل عادي من غيره.

   اللينك ممكن يكون:
     • يوتيوب       https://youtu.be/XXXXXXXX     (خلّي الفيديو "غير مدرج")
     • جوجل درايف   https://drive.google.com/file/d/XXXXXXXX/view
     • ملف فيديو    videos/m6.mp4                 (مرفوع جنب الصفحة)
   الكود بيعرف نوع اللينك لوحده.

   ملاحظة: الفيديو مش بينزل غير لما المتدرب يدوس على زرار التشغيل، فوجوده
   مش بيبطّأ الصفحة.
   ═══════════════════════════════════════════════════════════════════════════ */
window.SAMI_VIDEOS = {

  'm6-sterilization': { url: '', title: 'دورة التعقيم كاملة قدامك', minutes: '' },
  'm4-operations':    { url: '', title: 'شاشات دنتولايز — الحجز والتسجيل', minutes: '' },
  'm2-professionalism': { url: '', title: 'استقبال مريض — الشكل الصح', minutes: '' },

  /* الوحدات دي سايبينها فاضية — الكلام فيها كفاية. لو حبيت تضيف، املا اللينك. */
  'm1-dna':           { url: '', title: '', minutes: '' },
  'm3-escalation':    { url: '', title: '', minutes: '' },
  'm5-finance-social':{ url: '', title: '', minutes: '' },
  'm7-priorities':    { url: '', title: '', minutes: '' }
};
</script>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   رحلة عضو فريق مركز السامي — Al Sami Dental Center training simulator
   Single-file prototype. No build, no network needed, no dependencies.
   ═══════════════════════════════════════════════════════════════════════════ */

:root{
  /* Palette: warm paper (ورقي) surfaces stay as the backdrop; every accent —
     buttons, chips, badges, gradients — moves to a slate/steel-blue and
     graphite (رصاصي والأزرق) family. Gold is not a UI color here at all —
     it exists only inside the embedded logo image itself.
     Variable names below (--teal, --gold, --mint…) are kept as-is so the
     hundreds of call sites across the app don't need touching — only the
     values changed. */
  --porcelain:#FAF6EE;
  --surface:#FFFFFF;
  --surface-2:#F2EBDC;
  --surface-3:#E8DFC9;

  --ink:#2C2A25;
  --ink-2:#5B564A;
  --ink-3:#8E8779;

  --line:#E1D7C0;
  --line-2:#CBBEA0;

  --band:#242B31;
  --band-ink:#FFFFFF;
  --band-ink-2:#A9B7BF;

  /* Primary brand accent — a steel/slate blue, not sampled from the logo. */
  --teal:#3E6B85;
  --teal-2:#24404F;
  --teal-soft:#E4EBEE;
  --mint:#AEC0C9;

  /* Achievement moments get the deepest, richest step in the same blue-gray
     family — still no gold outside the logo mark itself. */
  --gold:#1F3A4D;
  --gold-soft:#E1E9ED;

  /* The gamification palette stays inside this slate/steel-blue family
     rather than reaching for outside hues, kept out of ordinary UI so it
     still means something when it shows up. */
  --flare:#3E7C99;    --flare-soft:#E1EDF1;
  --violet:#263238;   --violet-soft:#E4E8EA;
  --peach:#CDD9DE;    --peach-soft:#EFF3F5;
  --grad-celebrate:linear-gradient(135deg,var(--teal) 0%,var(--gold) 100%);
  /* A cool accent layer over the professional identity — reserved for the
     moments that should feel like a small win (levels, streaks, XP). */
  --grad-level:linear-gradient(135deg,#AEC0C9 0%,var(--gold) 45%,#16262F 100%);
  --grad-warm-soft:radial-gradient(420px 260px at 82% -12%, color-mix(in srgb,var(--peach) 45%, transparent), transparent 66%);

  --good:#5C7A52;  --good-soft:#EDF1E6;
  --warn:#B8762A;  --warn-soft:#F6EEDD;
  --crit:#9C4A42;  --crit-soft:#F5E8E4;

  --shadow-1:0 1px 2px rgba(44,42,37,.06), 0 10px 30px -16px rgba(44,42,37,.24);
  --shadow-2:0 2px 6px rgba(44,42,37,.07), 0 26px 54px -26px rgba(44,42,37,.36);
  --r:16px;
  --r-sm:11px;

  /* Cairo carries both headings and body copy — built for Arabic first, with
     an open, even letterform that stays clear at small sizes. Readex Pro
     (rounded, Latin-first) is dropped in its favor for legibility. */
  --f-display:"Cairo","IBM Plex Sans Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;
  --f-body:"Cairo","IBM Plex Sans Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}

/* Dark mode removed by request — the porcelain light theme is the only theme,
   regardless of the device's system preference. */

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}

body{
  margin:0;
  position:relative;
  min-height:100dvh;
  background:var(--porcelain);
  color:var(--ink);
  font-family:var(--f-body);
  font-size:16px;
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
  /* Two very soft lights so the field is not a flat slab. */
  background-image:
    radial-gradient(900px 500px at 88% -8%, color-mix(in srgb, var(--mint) 16%, transparent), transparent 60%),
    radial-gradient(700px 420px at 6% 102%, color-mix(in srgb, var(--teal) 9%, transparent), transparent 62%);
  background-attachment:fixed;
}

h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.45}
/* Arabic glyphs need more breathing room between lines than Latin does — tight
   leading makes descenders (ی ى ج) and diacritics from one line touch the next. */
p{margin:0}
button{font:inherit;color:inherit}

:focus-visible{
  outline:2.5px solid var(--teal);
  outline-offset:3px;
  border-radius:8px;
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ── layout ──────────────────────────────────────────────────────────────── */
.stage{max-width:600px;margin:0 auto;padding:0 18px 120px}
.stage.wide{max-width:860px}

/* ── HUD ─────────────────────────────────────────────────────────────────── */
.hud{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb, var(--porcelain) 88%, transparent);
  backdrop-filter:blur(14px) saturate(1.3);
  -webkit-backdrop-filter:blur(14px) saturate(1.3);
  border-bottom:1px solid var(--line);
}
.hud-in{max-width:600px;margin:0 auto;padding:11px 18px 12px;display:flex;flex-direction:column;gap:9px}
.hud-row{display:flex;align-items:center;gap:12px}
.hud-back{
  flex:none;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);cursor:pointer;
  display:grid;place-items:center;transition:.15s;
}
.hud-back:hover{border-color:var(--teal);color:var(--teal)}
.hud-title{flex:1;min-width:0;font-family:var(--f-display);font-weight:500;font-size:.95rem}
.hud-title small{display:block;font-family:var(--f-body);font-weight:400;font-size:.75rem;color:var(--ink-3);line-height:1.4}
.hud-stats{display:flex;align-items:center;gap:11px;flex:none}
.stat{display:flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:.78rem;font-variant-numeric:tabular-nums}
.stat.xp{color:var(--teal)}
.stat.streak{color:var(--flare)}
.stat.clock{color:var(--ink-3)}

/* segmented progress — one segment per scenario, so the reader can see
   exactly how many beats remain, not a vague sliver */
.segs{display:flex;gap:3px;height:5px}
.seg{flex:1;border-radius:99px;background:var(--surface-3);overflow:hidden;position:relative}
.seg i{position:absolute;inset:0;border-radius:99px;transform:scaleX(0);transform-origin:right;transition:transform .5s cubic-bezier(.2,.9,.3,1)}
.seg.done i{transform:scaleX(1);background:var(--teal)}
.seg.now i{transform:scaleX(1);background:linear-gradient(90deg,var(--mint),var(--teal))}
.seg.miss i{transform:scaleX(1);background:var(--crit)}

/* ── type ────────────────────────────────────────────────────────────────── */
.eyebrow{
  font-family:var(--f-body);font-size:.75rem;font-weight:500;color:var(--ink-3);
  letter-spacing:0; /* Arabic must never get letter-spacing: it breaks joining */
}
.eyebrow-en{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.display{font-family:var(--f-display);font-weight:600;font-size:clamp(1.75rem,6vw,2.5rem);letter-spacing:0;line-height:1.4}
.lede{color:var(--ink-2);font-size:1.02rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}

/* ── surfaces ────────────────────────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-1)}
.pad{padding:20px}
.pad-lg{padding:24px}

.eq-pair{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 11px;border-radius:99px;
  font-size:.76rem;font-weight:500;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);
}
.chip.teal{background:var(--teal-soft);color:var(--teal-2);border-color:transparent}
.chip.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.gold{background:var(--gold-soft);color:var(--gold);border-color:transparent}

/* ── buttons ─────────────────────────────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  min-height:52px;padding:14px 22px;border-radius:14px;border:1px solid transparent;
  font-family:var(--f-display);font-weight:500;font-size:1rem;
  cursor:pointer;transition:transform .12s cubic-bezier(.2,.9,.3,1), background .15s, border-color .15s, opacity .15s;
  touch-action:manipulation;user-select:none;
}
.btn:active:not(:disabled){transform:scale(.985)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--band);color:var(--band-ink);box-shadow:var(--shadow-1)}
.btn-primary:hover:not(:disabled){background:var(--teal-2)}
.btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--line-2)}
.btn-ghost:hover:not(:disabled){border-color:var(--teal);color:var(--teal-2)}
.btn-quiet{background:transparent;color:var(--ink-3);min-height:40px;padding:8px 14px;font-size:.88rem}
.btn-quiet:hover{color:var(--teal)}
.btn-full{width:100%}
.btn-row{display:flex;flex-direction:column;gap:10px}
@media(min-width:520px){.btn-row.side-by-side{flex-direction:row-reverse}.btn-row.side-by-side>*{flex:1}}

/* ── people ──────────────────────────────────────────────────────────────── */
/* Patients are people, not "المريض". Every conversation has a face, a name,
   an age, and a mood ring that visibly reacts to what the employee says. */
.person{display:flex;align-items:center;gap:12px}
.avatar{
  position:relative;flex:none;width:52px;height:52px;border-radius:50%;
  display:grid;place-items:center;
  font-family:var(--f-display);font-weight:600;font-size:1.05rem;color:#fff;
  background:linear-gradient(145deg,var(--av-a,#8FA3AF),var(--av-b,#3E5C74));
}
.avatar.sm{width:38px;height:38px;font-size:.85rem}
.avatar::after{
  content:"";position:absolute;inset:-4px;border-radius:50%;
  border:2.5px solid var(--mood,var(--line-2));
  transition:border-color .5s ease;
}
.person-meta{min-width:0}
.person-name{font-family:var(--f-display);font-weight:500;font-size:1rem;line-height:1.35}
.person-sub{font-size:.8rem;color:var(--ink-3);line-height:1.45}
.mood-word{font-size:.76rem;font-weight:500;color:var(--mood-text,var(--ink-3));transition:color .5s}

/* ── conversation ────────────────────────────────────────────────────────── */
.convo{display:flex;flex-direction:column;gap:12px;padding:18px;background:var(--surface-2);border-radius:var(--r);border:1px solid var(--line)}
.bubble{
  max-width:86%;padding:13px 16px;border-radius:18px;font-size:.99rem;line-height:1.7;
  animation:rise .35s cubic-bezier(.2,.9,.3,1) both;
}
.bubble.them{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-end-start-radius:6px}
.bubble.me{align-self:flex-end;background:var(--teal);color:#fff;border-end-end-radius:6px}
.bubble-who{display:block;font-size:.7rem;color:var(--ink-3);margin-bottom:3px}

.typing{display:flex;gap:4px;align-items:center;align-self:flex-start;padding:15px 18px;background:var(--surface);border:1px solid var(--line);border-radius:18px;border-end-start-radius:6px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);animation:blink 1.3s infinite}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .8s linear infinite;transform-origin:center}

.situation{font-size:1.16rem;line-height:1.85;font-family:var(--f-display);font-weight:400;animation:rise .4s cubic-bezier(.2,.9,.3,1) both}

/* ── options ─────────────────────────────────────────────────────────────── */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;align-items:flex-start;gap:13px;width:100%;
  padding:16px 17px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--surface);text-align:start;cursor:pointer;
  transition:border-color .16s, background .16s, transform .12s;
  animation:rise .35s cubic-bezier(.2,.9,.3,1) both;
}
.opt:hover{border-color:var(--teal);background:var(--teal-soft)}
.opt:active{transform:scale(.99)}
.opt[aria-checked="true"]{border-color:var(--teal);background:var(--teal-soft);box-shadow:var(--shadow-1)}
.opt-mark{
  flex:none;width:23px;height:23px;margin-top:2px;border-radius:50%;
  border:2px solid var(--line-2);display:grid;place-items:center;transition:.16s;
}
.opt.multi .opt-mark{border-radius:7px}
.opt[aria-checked="true"] .opt-mark{border-color:var(--teal);background:var(--teal)}
.opt-mark svg{opacity:0;transition:.16s;color:#fff}
.opt[aria-checked="true"] .opt-mark svg{opacity:1}
.opt-text{font-size:.99rem;line-height:1.72}
.opt.locked{pointer-events:none;opacity:.55}
.opt.reveal-approved{border-color:var(--good);background:var(--good-soft);opacity:1}
.opt.reveal-chosen-bad{border-color:var(--crit);background:var(--crit-soft);opacity:1}

/* ── ordering ────────────────────────────────────────────────────────────── */
.order{display:flex;flex-direction:column;gap:9px;list-style:none;padding:0;margin:0}
.ord{
  display:flex;align-items:stretch;gap:10px;padding:9px;border-radius:14px;
  border:1.5px solid var(--line);background:var(--surface);
  transition:border-color .16s, box-shadow .16s, transform .18s;
}
.ord.drag{border-color:var(--teal);box-shadow:var(--shadow-2);z-index:5}
.ord.bump{animation:pop .3s cubic-bezier(.2,.9,.3,1)}
.ord-grip{
  flex:none;width:38px;border-radius:10px;border:none;background:transparent;color:var(--ink-3);
  cursor:grab;display:grid;place-items:center;touch-action:none;
}
.ord-grip:active{cursor:grabbing}
.ord-rank{
  flex:none;width:34px;height:34px;align-self:center;border-radius:11px;
  background:var(--band);color:var(--band-ink);
  display:grid;place-items:center;font-family:var(--f-mono);font-size:.9rem;
  transition:background .3s;
}
.ord-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;padding:5px 0}
.ord-text{font-size:.95rem;line-height:1.55}
.ord-hint{font-size:.76rem;color:var(--ink-3);margin-top:2px}
.ord-arrows{flex:none;display:flex;flex-direction:column;justify-content:center;gap:2px}
.ord-arrow{width:34px;height:28px;border:none;background:transparent;color:var(--ink-3);border-radius:8px;cursor:pointer;display:grid;place-items:center}
.ord-arrow:hover:not(:disabled){background:var(--surface-2);color:var(--teal)}
.ord-arrow:disabled{opacity:.22;cursor:default}

/* ── escalation ladder ───────────────────────────────────────────────────── */
.ladder{display:flex;flex-direction:column;gap:0}
.rung{
  display:flex;align-items:flex-start;gap:13px;padding:15px 16px;
  border:1.5px solid var(--line);background:var(--surface);cursor:pointer;text-align:start;
  transition:.16s;position:relative;
}
.rung:first-of-type{border-radius:14px 14px 0 0}
.rung:last-of-type{border-radius:0 0 14px 14px}
.rung+.rung{border-top:none}
.rung:hover{border-color:var(--teal);background:var(--teal-soft);z-index:2}
.rung[aria-checked="true"]{border-color:var(--teal);background:var(--teal-soft);z-index:3;box-shadow:var(--shadow-1)}
.rung-n{flex:none;width:30px;height:30px;border-radius:9px;background:var(--band);color:var(--band-ink);display:grid;place-items:center;font-family:var(--f-mono);font-size:.82rem}
.rung-t{display:block;font-family:var(--f-display);font-weight:500;font-size:.98rem}
.rung-w{display:block;font-size:.8rem;color:var(--ink-3);line-height:1.55;margin-top:2px}
.bypass{
  margin-top:14px;display:flex;align-items:flex-start;gap:13px;width:100%;
  padding:15px 16px;border-radius:14px;border:2px dashed var(--crit);
  background:var(--crit-soft);cursor:pointer;text-align:start;transition:.16s;
}
.bypass[aria-checked="true"]{box-shadow:0 0 0 3px color-mix(in srgb,var(--crit) 22%,transparent)}
.bypass-t{display:block;font-family:var(--f-display);font-weight:600;color:var(--crit)}

.hist-row{
  display:flex;align-items:center;gap:12px;width:100%;text-align:start;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:11px 13px;margin-bottom:7px;transition:.15s;
}
.hist-row:hover{border-color:var(--teal)}
.hist-v{flex:none;font-family:var(--f-mono);font-size:1.05rem;font-weight:700;width:52px}
.hist-t{flex:1;min-width:0}
.hist-t b{display:block;font-size:.85rem;font-weight:600;line-height:1.5}
.hist-t span{display:block;font-size:.72rem;color:var(--ink-3);line-height:1.5}
.hist-d{flex:none;font-family:var(--f-mono);font-size:.82rem;font-weight:700}
.hist-d.muted{color:var(--ink-3);font-weight:400;font-size:.7rem}

.btn-link{background:none;border:0;padding:2px 6px;font:inherit;font-size:.74rem;color:var(--ink-3);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.btn-link:hover{color:var(--teal)}

/* ── secondary CTA ───────────────────────────────────────────────────────────
   An action that has to look worth tapping without stealing the primary button's
   job: accent colour and a clear arrow for the affordance, a tint instead of a
   fill for the hierarchy. */
.cta-soft{
  display:flex;align-items:center;gap:13px;width:100%;text-align:start;cursor:pointer;
  padding:14px 16px;border-radius:var(--r);
  background:var(--teal-soft);border:1.5px solid color-mix(in srgb,var(--teal) 26%,transparent);
  transition:border-color .18s, background .18s, transform .18s;
}
.cta-soft:hover{background:color-mix(in srgb,var(--teal) 16%,var(--teal-soft));border-color:var(--teal)}
.cta-soft:active{transform:scale(.985)}
.cta-soft-ico{
  flex:none;width:40px;height:40px;border-radius:12px;
  background:var(--teal);color:#fff;display:grid;place-items:center;
}
.cta-soft-txt{flex:1;min-width:0}
.cta-soft-txt b{display:block;font-family:var(--f-display);font-weight:600;font-size:1rem;color:var(--teal-2)}
.cta-soft-txt span{display:block;font-size:.79rem;color:var(--ink-2);margin-top:2px}
.cta-soft-go{flex:none;color:var(--teal);display:grid;place-items:center}

/* ── scenes (hotspot) ────────────────────────────────────────────────────── */
.scene-wrap{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.scene-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.scene{position:relative;width:100%;aspect-ratio:5/3;display:block}
.hs{
  position:absolute;border:2px dashed transparent;border-radius:10px;
  background:transparent;cursor:pointer;padding:0;
  transition:.2s;
}
.hs:hover{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 12%,transparent)}
/* One neutral "picked" state, for right and wrong picks alike. Colouring a pick
   green or amber the moment it's made answers the question the exercise is asking. */
.hs.picked{border:2px solid var(--teal);background:color-mix(in srgb,var(--teal) 18%,transparent)}
/* Short name tag on every scene element, always visible, so the trainee can tell what
   each thing IS. The full state of each one is spelled out in the list under the
   scene. pointer-events:none so the tag never steals the tap from its button. */
.hs-tag{
  /* Centred on its element and sized to its own words rather than to the box, so a
     name in a narrow hotspot is still readable instead of being cut in half. */
  position:absolute;pointer-events:none;z-index:2;
  top:4px;left:50%;transform:translateX(-50%);
  width:max-content;max-width:140px;
  font-size:.66rem;font-weight:600;line-height:1.3;text-align:center;
  color:var(--ink);background:color-mix(in srgb,var(--surface) 90%,transparent);
  border:1px solid var(--line);border-radius:7px;padding:2px 5px;
}
.hs.picked .hs-tag{border-color:var(--teal);color:var(--teal-2);background:var(--surface)}

/* The checklist under the scene: every element, named, with its state written out in
   full. Nothing is clipped or collapsed here — an unreadable option can't be judged. */
.scene-list{display:flex;flex-direction:column;gap:8px}
.scene-item{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:start;
  padding:12px 14px;border-radius:14px;cursor:pointer;
  background:var(--surface);border:1.5px solid var(--line);
  transition:border-color .18s, background .18s;
}
.scene-item:hover{border-color:var(--line-2)}
.scene-item.picked{border-color:var(--teal);background:var(--teal-soft)}
.scene-item-box{
  flex:none;width:21px;height:21px;margin-top:1px;border-radius:7px;
  border:1.5px solid var(--line-2);background:var(--surface);
  display:grid;place-items:center;color:transparent;transition:.18s;
}
.scene-item.picked .scene-item-box{background:var(--teal);border-color:var(--teal);color:#fff}
.scene-item-txt{flex:1;min-width:0}
.scene-item-txt b{display:block;font-size:.92rem;font-weight:600;color:var(--ink);margin-bottom:2px}
.scene-item-txt span{display:block;font-size:.83rem;line-height:1.7;color:var(--ink-2)}

/* ── feedback ────────────────────────────────────────────────────────────── */
.verdict{border-radius:var(--r);padding:20px;border:1px solid;animation:rise .4s cubic-bezier(.2,.9,.3,1) both}
.verdict h3{font-size:1.14rem;margin-bottom:6px}
.verdict p{font-size:.97rem;line-height:1.75;color:var(--ink-2)}
.v-approved{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.v-approved h3{color:var(--good)}
.v-partial,.v-weak{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.v-partial h3,.v-weak h3{color:var(--warn)}
.v-unsafe{background:var(--crit-soft);border-color:color-mix(in srgb,var(--crit) 30%,transparent)}
.v-unsafe h3{color:var(--crit)}
/* Neutral, for a written answer: informative without reading as a grade either way. */
.v-note{background:var(--surface-2);border-color:var(--line)}
.v-note h3{color:var(--ink)}

.principle{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.principle-h{display:flex;align-items:center;gap:9px;margin-bottom:9px;font-family:var(--f-display);font-weight:600;font-size:1rem}
.why{background:var(--surface-2);border-radius:12px;padding:15px;margin-top:14px}
.why-l{font-size:.74rem;color:var(--ink-3);margin-bottom:5px}
.why p{font-size:.94rem;line-height:1.78;color:var(--ink-2)}
.ref{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:.72rem;color:var(--ink-3)}

.keyorder{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.keyorder li{display:flex;align-items:flex-start;gap:11px}
.keyorder b{flex:none;width:28px;height:28px;border-radius:9px;background:var(--teal);color:#fff;display:grid;place-items:center;font-family:var(--f-mono);font-size:.78rem;font-weight:500}
.keyorder span{font-size:.92rem;line-height:1.6;color:var(--ink-2);padding-top:3px}

/* ── timer ───────────────────────────────────────────────────────────────── */
.timer{display:flex;align-items:center;gap:10px}
.timer.urgent .timer-n{color:var(--crit)}
.timer-n{font-family:var(--f-mono);font-size:1.05rem;font-weight:500;font-variant-numeric:tabular-nums}
.timer-l{font-size:.76rem;color:var(--ink-3)}

/* ── module map ──────────────────────────────────────────────────────────── */
.modlist{display:flex;flex-direction:column;gap:10px;list-style:none;padding:0;margin:0}
.mod{
  display:flex;align-items:center;gap:14px;width:100%;padding:16px;
  border-radius:var(--r);border:1px solid var(--line);background:var(--surface);
  cursor:pointer;text-align:start;transition:.16s;box-shadow:var(--shadow-1);
}
.mod:hover{border-color:var(--teal);transform:translateY(-1px);box-shadow:var(--shadow-2)}
.mod-n{
  flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;
  background:var(--surface-2);color:var(--ink-3);font-family:var(--f-mono);font-size:.95rem;
  border:1px solid var(--line);transition:.2s;
}
.mod.done .mod-n{background:var(--teal);color:#fff;border-color:transparent}
.mod-b{flex:1;min-width:0}
.mod-t{display:block;font-family:var(--f-display);font-weight:500;font-size:1.02rem}
.mod-s{display:block;font-size:.83rem;color:var(--ink-3);line-height:1.5;margin-top:2px}
.mod-go{flex:none;color:var(--ink-3)}

/* ── results ─────────────────────────────────────────────────────────────── */
.scorecard{
  border-radius:22px;padding:28px 24px;text-align:center;position:relative;overflow:hidden;
  background:var(--band);color:var(--band-ink);box-shadow:var(--shadow-2);
}
.scorecard::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(420px 260px at 78% -14%, color-mix(in srgb,var(--mint) 34%, transparent), transparent 66%);
  pointer-events:none;
}
.scorecard > *{position:relative}
.score-big{font-family:var(--f-mono);font-size:4rem;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.score-l{font-size:.8rem;color:var(--band-ink-2);margin-top:6px}
.band-tag{display:inline-flex;align-items:center;gap:7px;margin-top:16px;padding:7px 15px;border-radius:99px;font-size:.86rem;font-weight:500}

.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:14px 12px;text-align:center}
.metric b{display:block;font-family:var(--f-mono);font-size:1.5rem;font-weight:500;font-variant-numeric:tabular-nums}
.metric span{display:block;font-size:.72rem;color:var(--ink-3);line-height:1.4;margin-top:3px}

.barlist{display:flex;flex-direction:column;gap:14px;list-style:none;padding:0;margin:0}
.barrow{display:flex;flex-direction:column;gap:6px}
.barhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.barhead span{font-size:.95rem}
.barhead b{font-family:var(--f-mono);font-size:.9rem;font-weight:500;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.bartrack{height:9px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.barfill{height:100%;border-radius:99px;transform-origin:right;animation:grow .9s cubic-bezier(.2,.9,.3,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.badges{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:520px){.badges{grid-template-columns:repeat(3,1fr)}}
.badge{
  border-radius:14px;padding:14px 12px;text-align:center;
  background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 26%,transparent);
  animation:pop .45s cubic-bezier(.2,.9,.3,1) both;
}
.badge b{display:block;font-family:var(--f-display);font-size:.9rem;font-weight:600;color:var(--gold);margin-top:6px}
.badge span{display:block;font-size:.72rem;color:var(--ink-3);line-height:1.45;margin-top:3px}

.listcard{display:flex;flex-direction:column;gap:11px;list-style:none;padding:0;margin:0}
.listcard li{display:flex;align-items:flex-start;gap:11px;font-size:.95rem;line-height:1.7;color:var(--ink-2)}
.dot{flex:none;width:7px;height:7px;border-radius:50%;margin-top:9px;background:var(--teal)}

/* ── misc ────────────────────────────────────────────────────────────────── */
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:.82rem;color:var(--ink-2);font-weight:500}
.input,select.input,textarea.input{
  width:100%;min-height:52px;padding:14px 16px;border-radius:14px;
  border:1.5px solid var(--line);background:var(--surface);color:var(--ink);
  font-family:var(--f-body);font-size:1rem;transition:border-color .16s;
}
.input:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 3px var(--teal-soft)}
textarea.input{min-height:130px;resize:vertical;line-height:1.75}

.divide{height:1px;background:var(--line);border:none;margin:0}
.stack{display:flex;flex-direction:column}
.g8{gap:8px} .g12{gap:12px} .g16{gap:16px} .g20{gap:20px} .g28{gap:28px} .g36{gap:36px}
.center{text-align:center}
.muted{color:var(--ink-3)}
.tiny{font-size:.76rem;line-height:1.6}

.toast{
  position:fixed;bottom:22px;inset-inline:0;margin:0 auto;width:max-content;max-width:88vw;z-index:70;
  background:var(--band);color:var(--band-ink);padding:12px 20px;border-radius:99px;
  font-size:.9rem;box-shadow:var(--shadow-2);animation:rise .3s cubic-bezier(.2,.9,.3,1) both;
}

.xp-fly{
  position:fixed;z-index:80;pointer-events:none;
  font-family:var(--f-mono);font-weight:500;color:var(--teal);
  animation:fly 1.1s cubic-bezier(.2,.9,.3,1) both;
}
@keyframes fly{0%{opacity:0;transform:translateY(6px) scale(.9)}25%{opacity:1;transform:translateY(-4px) scale(1)}100%{opacity:0;transform:translateY(-46px) scale(1)}}

.thinking{
  border-radius:var(--r);padding:30px 24px;text-align:center;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-1);
  animation:rise .4s cubic-bezier(.2,.9,.3,1) both;
}
.think-ring{
  width:74px;height:74px;margin:0 auto 16px;border-radius:50%;
  display:grid;place-items:center;position:relative;
  background:var(--teal-soft);color:var(--teal);
}
.think-ring svg.ring{position:absolute;inset:-3px;transform:rotate(-90deg)}
.think-ring circle{fill:none;stroke-width:3;stroke-linecap:round}
.think-q{font-family:var(--f-display);font-size:1.2rem;font-weight:500;line-height:1.7;max-width:26ch;margin:0 auto}

.takeaway{
  border-radius:var(--r);padding:24px;
  background:var(--teal-soft);border:1.5px solid color-mix(in srgb,var(--teal) 26%,transparent);
}
.takeaway-l{font-size:.76rem;color:var(--teal-2);font-weight:600;margin-bottom:8px}
.takeaway p{font-family:var(--f-display);font-size:1.12rem;line-height:1.8;color:var(--ink)}

.radar-wrap{display:grid;place-items:center;padding:8px 0}
.radar text{font-family:var(--f-body);font-size:9px;fill:var(--ink-3)}

/* ── map hero: the unit map opens with the centre's own mark, not bare text ── */
.map-hero{
  position:relative;overflow:hidden;border-radius:var(--r);
  background:var(--band);color:var(--band-ink);
  padding:24px 22px 22px;text-align:center;
  box-shadow:var(--shadow-2);
  animation:bounceIn .5s cubic-bezier(.2,.9,.3,1) both;
}
.map-hero::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(320px 200px at 88% -18%, color-mix(in srgb,var(--teal) 40%,transparent), transparent 68%);
}
.map-hero-logo{position:relative;width:42px;height:auto;margin:0 auto 12px;display:block}
.map-hero .eyebrow{position:relative;color:var(--band-ink-2);justify-content:center;display:flex}
.map-hero h1{position:relative;color:var(--band-ink);margin-top:6px;font-size:1.5rem;font-weight:600;font-family:var(--f-display)}

/* ── gamification: level & XP ────────────────────────────────────────────── */
.level-chip{
  display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 6px;border-radius:99px;
  background:var(--grad-level);color:#fff;font-size:.78rem;font-weight:600;
  box-shadow:0 4px 14px -6px color-mix(in srgb,var(--violet) 60%,transparent);
}
.level-chip .lv-n{
  display:grid;place-items:center;width:22px;height:22px;border-radius:50%;
  background:rgba(255,255,255,.24);font-family:var(--f-mono);font-size:.72rem;font-weight:600;
}
.level-card{
  border-radius:var(--r);padding:18px 20px;position:relative;overflow:hidden;
  background:var(--grad-level);color:#fff;box-shadow:var(--shadow-2);
}
.level-card::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(280px 160px at 92% -10%, rgba(255,255,255,.28), transparent 65%);
}
.level-card>*{position:relative}
.level-card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.level-card-title{font-family:var(--f-display);font-weight:600;font-size:1.08rem}
.level-card-sub{font-size:.78rem;color:rgba(255,255,255,.78);margin-top:2px}
.level-card .lv-big{
  flex:none;width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.2);
  display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:1.1rem;
}
.xp-track{height:8px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden;margin-top:14px}
.xp-fill{height:100%;border-radius:99px;background:#fff;transform-origin:right;animation:grow 1s cubic-bezier(.2,.9,.3,1) both}
.xp-note{display:flex;justify-content:space-between;gap:10px;margin-top:7px;font-size:.72rem;color:rgba(255,255,255,.78)}
.xp-note .mono{color:#fff}

/* flame pulses once a streak is worth noticing — quiet otherwise */
.stat.streak{position:relative}
.stat.streak.hot{animation:flamePulse 1.1s ease-in-out infinite}
@keyframes flamePulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 transparent)}50%{transform:scale(1.2);filter:drop-shadow(0 0 6px color-mix(in srgb,var(--flare) 65%,transparent))}}

/* ── logo figure: the centre's own mark is what "performs" at a moment that
   should feel like a win — a level-up, finishing a module, a strong result.
   No illustrated character; the mark itself arrives, settles, and (on a
   celebration) gives a small pulse. Never appears on the working screens
   (identity, map, scenarios). ────────────────────────────────────────── */
.mascot-wrap{
  flex:none;display:grid;place-items:center;border-radius:50%;
  background:var(--grad-warm-soft),var(--peach-soft);
  animation:bounceIn .55s cubic-bezier(.2,.9,.3,1) both;
}
.mascot-wrap.sm{width:52px;height:52px}
.mascot-wrap.md{width:70px;height:70px}
.mascot-wrap.lg{width:88px;height:88px}
@keyframes bounceIn{0%{opacity:0;transform:scale(.5) translateY(8px)}62%{opacity:1;transform:scale(1.08) translateY(-3px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-4px) rotate(-2deg)}}
@keyframes logoPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.logo-figure{will-change:transform}
.logo-figure-wave{animation:floaty 2.8s ease-in-out infinite}
.logo-figure-celebrate{animation:logoPulse 1.5s ease-in-out infinite}

/* ── hero figure: open, unclipped placement for the welcome screen ──────── */
.hero-figure{
  position:relative;display:grid;place-items:center;padding:6px 0 2px;
  animation:bounceIn .6s cubic-bezier(.2,.9,.3,1) both;
}
.hero-figure::before{
  content:"";position:absolute;width:160px;height:160px;border-radius:50%;z-index:0;
  background:radial-gradient(circle, color-mix(in srgb,var(--teal) 15%,transparent) 0%, transparent 72%);
}
.hero-figure .logo-figure{position:relative;z-index:1}

/* ── gamification: badges ────────────────────────────────────────────────── */
.badge{position:relative}
.badge.new{
  background:var(--grad-celebrate);border-color:transparent;
  box-shadow:0 8px 22px -10px color-mix(in srgb,var(--flare) 55%,transparent);
  animation:bounceIn .5s cubic-bezier(.2,.9,.3,1) both;
}
.badge.new b, .badge.new span{color:#fff}
.badge.new::after{
  content:"جديدة";position:absolute;top:-8px;inset-inline-end:-6px;
  background:var(--ink);color:var(--porcelain);font-size:.6rem;font-weight:700;
  padding:2px 7px;border-radius:99px;box-shadow:var(--shadow-1);
}
.badge:not(.new) b{color:var(--gold)}
.badge-locked{
  border-radius:14px;padding:14px 12px;text-align:center;
  background:var(--surface-2);border:1px dashed var(--line-2);opacity:.62;
}
.badge-locked span{display:block;font-size:.72rem;color:var(--ink-3);margin-top:6px;line-height:1.4}

/* ── celebratory shimmer on the primary path forward ─────────────────────── */
.btn-primary{position:relative;overflow:hidden}
.btn-primary::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.22) 38%,transparent 55%);
  transform:translateX(-120%);
}
.btn-primary.shine::after{animation:shine 2.6s ease-in-out .4s infinite}
@keyframes shine{0%{transform:translateX(-120%)}45%{transform:translateX(120%)}100%{transform:translateX(120%)}}

/* ── confetti burst (pure CSS, JS just drops the pieces in) ─────────────── */
.confetti-layer{position:fixed;inset:0;z-index:90;pointer-events:none;overflow:hidden}
.confetti-piece{
  position:absolute;top:-14px;width:8px;height:13px;border-radius:2px;
  animation:confettiFall linear both;
}
@keyframes confettiFall{
  0%{transform:translateY(0) rotate(0deg);opacity:1}
  100%{transform:translateY(105vh) rotate(540deg);opacity:.85}
}

/* ── level-up celebration modal ──────────────────────────────────────────── */
.levelup-scrim{
  position:fixed;inset:0;z-index:95;display:grid;place-items:center;padding:24px;
  background:color-mix(in srgb, var(--ink) 88%, transparent);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  animation:fade .25s ease both;
}
.levelup-card{
  max-width:340px;width:100%;border-radius:24px;padding:32px 26px 26px;text-align:center;
  background:var(--grad-level);color:#fff;box-shadow:var(--shadow-2);
  animation:levelPop .5s cubic-bezier(.2,.9,.3,1) both;
}
@keyframes levelPop{0%{opacity:0;transform:scale(.8) translateY(14px)}70%{transform:scale(1.03)}100%{opacity:1;transform:none}}
.levelup-ring{
  width:84px;height:84px;margin:0 auto 14px;border-radius:50%;
  background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.5);
  display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:1.7rem;
}
.levelup-eyebrow{font-size:.76rem;color:rgba(255,255,255,.8);font-weight:600}
.levelup-title{font-family:var(--f-display);font-weight:700;font-size:1.4rem;margin-top:5px}
.levelup-sub{font-size:.92rem;color:rgba(255,255,255,.86);margin-top:8px;line-height:1.7}
.levelup-card .btn-primary{background:#fff;color:var(--violet);margin-top:22px}
.levelup-card .btn-primary:hover{background:#fff;opacity:.92}

/* ── quick guide modal: calm and instructional, not a celebration ───────── */
.onb-scrim{
  position:fixed;inset:0;z-index:95;display:grid;place-items:center;padding:24px;
  background:color-mix(in srgb, var(--ink) 72%, transparent);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  animation:fade .22s ease both;
}
.onb-card{
  max-width:360px;width:100%;border-radius:24px;padding:30px 24px 24px;text-align:center;
  background:var(--surface);color:var(--ink);box-shadow:var(--shadow-2);position:relative;
  animation:levelPop .4s cubic-bezier(.2,.9,.3,1) both;
}
.onb-skip{
  position:absolute;top:14px;inset-inline-start:14px;width:30px;height:30px;border-radius:50%;
  border:none;background:var(--surface-2);color:var(--ink-3);font-size:.85rem;line-height:1;cursor:pointer;
}
.onb-dots{display:flex;justify-content:center;gap:6px;margin-bottom:18px}
.onb-dots span{width:6px;height:6px;border-radius:50%;background:var(--line-2)}
.onb-dots span.on{background:var(--teal);width:18px;border-radius:99px;transition:.2s}
.onb-icon{
  width:56px;height:56px;margin:0 auto 14px;border-radius:16px;color:var(--teal);
  background:var(--teal-soft);display:grid;place-items:center;
}
.onb-eyebrow{font-size:.76rem;color:var(--teal-2);font-weight:600}
.onb-title{font-family:var(--f-display);font-weight:700;font-size:1.28rem;margin-top:6px}
.onb-body{font-size:.96rem;line-height:1.85;color:var(--ink-2);margin-top:10px}
.onb-card .btn-row{margin-top:22px}

/* ── a touch more shimmer where achievement lives ────────────────────────── */
.scorecard::before{
  background:
    radial-gradient(420px 260px at 78% -14%, color-mix(in srgb,var(--mint) 34%, transparent), transparent 66%),
    radial-gradient(260px 200px at 6% 112%, color-mix(in srgb,var(--gold) 22%, transparent), transparent 70%);
}
.mod{transition:.18s cubic-bezier(.2,.9,.3,1)}
.mod:hover .mod-n{transform:scale(1.06)}
.mod:hover{box-shadow:var(--shadow-2), 0 0 0 1px color-mix(in srgb,var(--teal) 30%,transparent)}
/* ── فيديو الوحدة ───────────────────────────────────────────────────────────
   A facade, not a live embed: nothing is fetched from the video host until the
   trainee taps play. That keeps the unit's closing screen as fast as it is
   without a video, and leaves the unit fully usable with no connection at all. */
.vid-shell{position:relative;display:block;width:100%;aspect-ratio:16/9;border:0;padding:0;margin:0;
  border-radius:var(--r-sm);overflow:hidden;background:#17160F;cursor:pointer;color:#fff;
  -webkit-tap-highlight-color:transparent}
.vid-shell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;opacity:.6;
  transition:opacity .25s ease, transform .45s ease}
.vid-shell:hover img,.vid-shell:focus-visible img{opacity:.8;transform:scale(1.03)}
.vid-shell:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
.vid-fallback{position:absolute;inset:0;
  background:radial-gradient(120% 100% at 50% 0%, #3A3830 0%, #17160F 70%)}
.vid-play{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.vid-play i{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.95);color:#17160F;
  display:grid;place-items:center;box-shadow:0 6px 24px rgba(0,0,0,.4);transition:transform .2s ease}
.vid-shell:hover .vid-play i{transform:scale(1.08)}
.vid-dur{position:absolute;bottom:9px;inset-inline-start:9px;background:rgba(0,0,0,.68);color:#fff;
  font-size:.72rem;padding:3px 9px;border-radius:6px;font-variant-numeric:tabular-nums;letter-spacing:0}
.vid-frame{position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--r-sm);overflow:hidden;background:#000}
.vid-frame iframe,.vid-frame video{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}

/* ── figure ────────────────────────────────────────────────────────────────
   A simple flat character in the centre's own colours — a warm, human
   counterweight to the otherwise professional interface. Reserved on purpose
   for genuine moments (a welcome, a finished module, a level-up, a strong
   result); it never shows up on the working screens. Poses: 'idle', 'wave',
   'celebrate'. */
function mascot(size, pose) {
  // No character illustration — the centre's own logo mark is the one thing
  // that "performs" at a celebration moment. 'wave' gives it a soft rise-in
  // on arrival (welcome screen); 'celebrate' gives it a brisker bounce +
  // settle for a finished module, a level-up, or a strong result. 'idle'
  // (default) sits still. The mark's gold reads on any surface, so one
  // asset covers every placement.
  const s = size || 56;
  const p = pose || 'idle';
  const cls = p === 'celebrate' ? 'logo-figure logo-figure-celebrate' : p === 'wave' ? 'logo-figure logo-figure-wave' : 'logo-figure';
  return '<img src="' + LOGO_MARK + '" alt="مركز السامي" class="' + cls + '" style="width:' + s + 'px;height:auto;display:block">';
}

/* ── seeded randomness (stable per session) ───────────────────────────────── */
function seedOf(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return (h ^= h >>> 16) >>> 0;
}
function rng(seedStr) {
  let a = seedOf(seedStr);
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rand) {
  const out = arr.slice();
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    const t = out[i]; out[i] = out[j]; out[j] = t;
  }
  return out;
}

function initials(name) {
  const clean = String(name).replace(/^(أ\.|د\.|الحاجة)\s*/, '').trim();
  const parts = clean.split(/\s+/);
  return (parts[0] || '؟').slice(0, 1) + (parts[1] ? parts[1].slice(0, 1) : '');
}

/* ═══════════════════════════════════════════════════════════════════════════
   ENGINE — ported verbatim from src/engine. Pure, deterministic.
   ═══════════════════════════════════════════════════════════════════════════ */
const QUALITY_CREDIT = { approved: 1, partial: 0.55, weak: 0.2, unsafe: 0 };
const RETRY_DISCOUNT = 0.75;
const CRIT_PER_ERROR = 6, CRIT_CAP = 18, PASS_MARK = 70;
const CAT_W = { culture: 20, problemSolving: 20, communication: 15, prioritization: 15, judgment: 10, operations: 10 };
const SPEED_W = 5, RECOVERY_W = 5;
const CAT_LABEL = {
  culture: 'ثقافتنا', communication: 'التواصل', problemSolving: 'حل المشكلات',
  prioritization: 'ترتيب الأولويات', judgment: 'حدود الصلاحية', operations: 'دقة الشغل'
};

const ALL = {};
Object.keys(DATA.training).forEach(m => DATA.training[m].forEach(s => { ALL[s.id] = s; }));
DATA.assessment.forEach(s => { ALL[s.id] = s; });
const getScenario = (id) => ALL[id];

function scoreAnswer(r) {
  const s = getScenario(r.scenarioId);
  const base = (s && s.scoring.basePoints) || 8;
  if (s && s.render === 'shortAnswer') {
    return { pointsAwarded: 0, pointsPossible: 0, manualGrade: true };
  }
  if (r.criticalFailure) return { pointsAwarded: 0, pointsPossible: base };

  const usedRetry = r.attempts > 1 && r.finalQuality !== r.firstQuality;
  let pts = base * QUALITY_CREDIT[r.finalQuality] * (usedRetry ? RETRY_DISCOUNT : 1);

  const sw = (s && s.scoring.speedWeight) || 0;
  const target = s && s.scoring.targetSeconds;
  const limit = (s && s.scoring.limitSeconds) || (target ? target * 2.5 : null);
  const safeAndRight = r.finalQuality === 'approved';

  // Speed is a multiplier on a correct, safe answer — never a compensation.
  if (sw > 0 && target && limit && safeAndRight) {
    const sec = r.responseMs / 1000;
    const ratio = sec <= target ? 1 : Math.max(0, (limit - sec) / (limit - target));
    pts += base * sw * ratio;
  }
  if (r.hintsUsed > 0) pts *= Math.max(0.7, 1 - r.hintsUsed * 0.15);

  return {
    pointsAwarded: Math.round(pts * 100) / 100,
    pointsPossible: Math.round(base * (1 + (safeAndRight ? sw : 0)) * 100) / 100
  };
}

const pct = (e, p) => (p <= 0 ? 0 : Math.round((e / p) * 100));

function principleScore(rows, p) {
  const m = rows.filter(a => a.principles.indexOf(p) >= 0 && !a.manualGrade);
  if (!m.length) return 100;
  return pct(m.reduce((s, a) => s + a.pointsAwarded, 0), m.reduce((s, a) => s + a.pointsPossible, 0));
}

function computeScore(answers) {
  // Written answers are graded by a person, so they take part in no ratio here —
  // dropping them once at the top is safer than remembering to exclude them in
  // each of the dozen places below.
  const scorable = answers.filter(a => !a.manualGrade);
  const graded = scorable.filter(a => a.phase === 'assessment');
  const src = graded.length ? graded : scorable;

  const categories = Object.keys(CAT_W).map(cat => {
    const rows = src.filter(a => a.category === cat);
    const earned = rows.reduce((s, a) => s + a.pointsAwarded, 0);
    const possible = rows.reduce((s, a) => s + a.pointsPossible, 0);
    // No scenario drawn for this category means it wasn't measured — not that the
    // employee scored zero in it. Reporting an unasked question as a failure is the
    // same mistake as crediting an untested one as a success.
    return {
      category: cat, label: CAT_LABEL[cat], weight: CAT_W[cat], count: rows.length,
      percent: rows.length ? pct(earned, possible) : null
    };
  });
  const find = c => (categories.find(x => x.category === c) || { percent: null }).percent;

  const safetyRows = src.filter(a => a.safetyCritical);
  const safety = safetyRows.length
    ? pct(safetyRows.reduce((s, a) => s + a.pointsAwarded, 0), safetyRows.reduce((s, a) => s + a.pointsPossible, 0))
    : 100;

  const decisionQuality = src.length
    ? Math.round(src.reduce((s, a) => s + (a.criticalFailure ? 0 : QUALITY_CREDIT[a.firstQuality]), 0) / src.length * 100)
    : 0;

  const timed = src.filter(a => a.targetSeconds && a.finalQuality === 'approved');
  const responseSpeed = timed.length
    ? Math.round(timed.reduce((s, a) => {
        const t = (a.targetSeconds || 20) * 1000;
        return s + (a.responseMs <= t ? 1 : Math.max(0, 1 - (a.responseMs - t) / (t * 2)));
      }, 0) / timed.length * 100)
    : 100;

  // Recovery only means something when the trainee actually had a real chance to
  // recover from a weak/unsafe first answer. No such chance in this session (a
  // clean run, or simply no retry-eligible situation drawn) is NOT the same as
  // "recovered perfectly" — it means the metric wasn't exercised, so it stays
  // null rather than defaulting to a flattering 100.
  const chances = src.filter(a => a.retryOffered && (a.firstQuality === 'weak' || a.firstQuality === 'unsafe'));
  const recovery = chances.length ? Math.round(chances.filter(a => a.recovered).length / chances.length * 100) : null;

  // Consistency: how evenly one principle is applied across different modules.
  const byP = {};
  src.forEach(a => a.principles.forEach(p => {
    (byP[p] = byP[p] || []).push(a.criticalFailure ? 0 : QUALITY_CREDIT[a.finalQuality]);
  }));
  const spreads = [];
  Object.keys(byP).forEach(p => {
    const v = byP[p];
    if (v.length < 2) return;
    const mean = v.reduce((s, x) => s + x, 0) / v.length;
    spreads.push(Math.sqrt(v.reduce((s, x) => s + (x - mean) * (x - mean), 0) / v.length));
  });
  const consistency = spreads.length
    ? Math.max(0, Math.round((1 - (spreads.reduce((s, x) => s + x, 0) / spreads.length) * 2) * 100))
    : 100;

  const wrong = src.filter(a => a.confidence && (a.finalQuality === 'weak' || a.finalQuality === 'unsafe'));
  const overconfidence = wrong.length
    ? Math.round(wrong.filter(a => a.confidence === 'veryConfident' || a.confidence === 'confident').length / wrong.length * 100)
    : 0;

  // When recovery has no data, its 0.15 share is redistributed across the other
  // signals (renormalized to the remaining 0.85) rather than assuming a score.
  // Every signal carries its weight only when it exists; the rest of the weights are
  // renormalised over what was measured, so a missing signal neither helps nor hurts.
  const CA_PARTS = [
    [0.25, decisionQuality], [0.20, find('problemSolving')], [0.15, find('prioritization')],
    [0.10, consistency], [0.10, responseSpeed], [0.05, principleScore(src, 'systemOfRecord')],
    [0.15, recovery]
  ].filter(p => p[1] !== null && p[1] !== undefined);
  const CA_W = CA_PARTS.reduce((s, p) => s + p[0], 0);
  const cognitiveAgility = CA_W ? Math.round(CA_PARTS.reduce((s, p) => s + p[0] * p[1], 0) / CA_W) : 0;

  const d = {
    safety, teamwork: principleScore(src, 'teamwork'), communication: find('communication'),
    decisionQuality, cognitiveAgility, responseSpeed, recovery, consistency, overconfidence
  };

  const criticalFlags = src.filter(a => a.criticalFailure).map(a => {
    const s = getScenario(a.scenarioId) || {};
    return { scenarioId: a.scenarioId, scenarioTitle: s.title || a.scenarioId, chosen: a.finalAnswer, category: a.category, manualRef: s.manualRef || '' };
  });
  const criticalPenalty = Math.min(criticalFlags.length * CRIT_PER_ERROR, CRIT_CAP);

  // The rubric's full scale is 90 (categories) + 5 (speed) + 5 (recovery) = 100.
  // With no recovery data, that 5-point slice can't be earned OR withheld — it
  // would be unfair either way, since which scenarios a session draws isn't the
  // trainee's choice. So the achievable scale shrinks to 95 and the raw score is
  // prorated back up to 100 over what was actually measurable.
  const measuredCats = categories.filter(c => c.percent !== null);
  const weighted = measuredCats.reduce((s, c) => s + (c.percent / 100) * c.weight, 0);
  const CAT_W_TOTAL = measuredCats.reduce((s, c) => s + c.weight, 0);
  const recoveryBonus = recovery === null ? 0 : (recovery / 100) * RECOVERY_W;
  const achievableMax = CAT_W_TOTAL + SPEED_W + (recovery === null ? 0 : RECOVERY_W);
  const rawScore = weighted + (d.responseSpeed / 100) * SPEED_W + recoveryBonus;
  const overallPercent = Math.max(0, Math.round(rawScore / achievableMax * 100 - criticalPenalty));

  let band;
  if (criticalFlags.length >= 2) band = 'concerns';
  else if (criticalFlags.length === 1) band = overallPercent >= 55 ? 'needsTraining' : 'concerns';
  else if (overallPercent >= 85) band = 'strongFit';
  else if (overallPercent >= 70) band = 'promising';
  else if (overallPercent >= 55) band = 'needsTraining';
  else band = 'concerns';

  // A "strength" is a genuine claim, not a slot to fill. Only categories that
  // actually clear a real bar count — never padded up to 3 just for the sake of
  // it. A trainee who's weak everywhere ends up with a short list, or none at
  // all, and the report says so plainly instead of manufacturing positives.
  const STRENGTH_BAR = 75;
  const ranked = measuredCats.slice().sort((a, b) => b.percent - a.percent);
  const strengths = ranked.filter(c => c.percent >= STRENGTH_BAR).slice(0, 3).map(c => c.label);
  const gaps = ranked.slice().reverse().slice(0, 3).filter(c => c.percent < 85).map(c => c.label);
  if (strengths.length < 3 && d.safety >= 92) strengths.push('الحفاظ على سلامة المريض');
  if (strengths.length < 3 && recovery !== null && recovery >= 85) strengths.push('التعافي بعد الخطأ');
  if (gaps.length < 3 && d.consistency < 75) gaps.push('ثبات المبدأ عبر المواقف المختلفة');

  return {
    overallPercent, categories, diagnostics: d, criticalFlags, criticalPenalty, band,
    passed: overallPercent >= PASS_MARK && criticalFlags.length === 0,
    strengths: strengths.slice(0, 3), developmentAreas: gaps.slice(0, 3),
    insights: buildInsights(categories, d, criticalFlags, src)
  };
}

/* Deterministic HR observations — every sentence comes from an explicit rule. */
function buildInsights(categories, d, flags, answers) {
  const c = {}; categories.forEach(x => { c[x.category] = x.percent; });
  const critCats = {}; flags.forEach(f => { critCats[f.category] = true; });
  const wrongHiConf = answers.filter(a =>
    (a.finalQuality === 'weak' || a.finalQuality === 'unsafe') &&
    (a.confidence === 'veryConfident' || a.confidence === 'confident')).length;
  const hints = answers.reduce((s, a) => s + a.hintsUsed, 0);
  const timed = answers.filter(a => a.targetSeconds).length;

  const rules = [
    [d.responseSpeed >= 80 && c.judgment <= 60, 'سريع وذكي في التعامل مع المواقف، بس عنده ميل ياخد القرار لوحده في مواقف كان لازم يصعّدها، وده واضح أكتر في الحالات المالية.'],
    [c.communication >= 80 && c.prioritization <= 65, 'شاطر في التواصل، بس ترتيب الأولويات بيضعف لما أكتر من مهمة تيجي مع بعض.'],
    [d.consistency < 70, 'بيطبّق القاعدة في مواقف وبينساها في مواقف تانية من نفس النوع — محتاج يفهم سبب القاعدة، مش بس الموقف اللي اتعلمها فيه.'],
    [wrongHiConf >= 3, 'كان واثق جدًا في قرارات غلط أكتر من مرة — محتاج تصحيح مباشر، مش تدريب عام.'],
    [d.recovery >= 75 && d.decisionQuality < 65, 'اختياره الأول مش دايمًا الأفضل، بس بيصحّح بسرعة لما يراجع نفسه — ده نوع سهل التدريب.'],
    [d.safety >= 95 && c.operations < 70, 'حسّه تجاه سلامة المريض كويس، والمشكلة في تفاصيل الشغل مش في حكمه على الموقف.'],
    [d.safety < 70, 'فيه قرارات لمست سلامة المريض أو قواعد التعقيم — ده أولوية تدريب قبل أي حاجة تانية.'],
    [!!(critCats.judgment || critCats.operations), 'فيه تجاوز في حدود الصلاحية أو في دقة تسجيل البيانات — الأفضل تراجعوا معاه قواعد الصلاحيات والحسابات قبل ما يشتغل لوحده.'],
    [d.teamwork < 65, 'بيحب يفصل بين شغله وشغل الفريق — محتاج توضيح إن المساعدة في المهام المسموح بيها جزء من شغلانته.'],
    [d.decisionQuality >= 75 && d.responseSpeed < 55 && timed >= 2, 'قراراته مظبوطة بس استجابته أبطأ من المطلوب في المواقف اللي محتاجة سرعة — التدريب هنا على السرعة مش على الحكم.'],
    [answers.length > 0 && hints / answers.length >= 0.4, 'استخدم التلميحات في عدد ملحوظ من المواقف — بيفهم القاعدة لما حد يفكّره بيها، بس لسه مش بيتذكرها لوحده.'],
    [flags.length === 0 && d.safety >= 90 && d.consistency >= 80 && Object.keys(c).every(k => c[k] >= 75), 'أداء ثابت في كل المحاور من غير أي أخطاء حرجة — مؤشرات كويسة إنه جاهز يشتغل بإشراف عادي.']
  ];
  const fired = rules.filter(r => r[0]).map(r => r[1]);
  return fired.length ? fired.slice(0, 5) : ['ملحظناش نمط معين يستاهل ملاحظة خاصة في الجلسة دي.'];
}

const BAND = {
  strongFit: { ar: 'جاهز للعمل بإشراف عادي', en: 'Strong fit', c: 'var(--good)' },
  promising: { ar: 'واعد — يحتاج متابعة في نقاط محددة', en: 'Promising / needs coaching', c: 'var(--teal)' },
  needsTraining: { ar: 'محتاج تدريب زيادة قبل ما يشتغل لوحده', en: 'Requires more training', c: 'var(--warn)' },
  concerns: { ar: 'مؤشرات محتاجة حد يراجعها ويقرر بنفسه', en: 'Significant concerns', c: 'var(--crit)' }
};

/* ── levels / rank ────────────────────────────────────────────────────────── */
/* A ladder on top of raw XP so progress reads as a story ("عضو فريق فعّال")
   not just a rising number. Titles stay inside how the manual talks about
   growth — تعلّم مستمر، مش مجرد نقط. */
/* A ladder of trust, not of hype: every rung is something a manager could actually
   write next to an employee's name — no showbiz titles, which describe nobody's work. */
const LEVELS = [
  { title: 'أول يوم في مركز السامي',   min: 0,    icon: 'star' },
  { title: 'تحت التدريب',              min: 60,   icon: 'star' },
  { title: 'عضو في الفريق',            min: 150,  icon: 'users' },
  { title: 'متمكّن من شغله',            min: 270,  icon: 'shield' },
  { title: 'ثابت تحت الضغط',           min: 420,  icon: 'gauge' },
  { title: 'موثوق في تصرفه',           min: 600,  icon: 'target' },
  { title: 'مرجع لزمايله في الشغل',    min: 800,  icon: 'layers' },
  { title: 'قدوة في ثقافة مركز السامي', min: 1050, icon: 'brain' }
];
function levelFor(xp) {
  let i = 0;
  for (let k = 0; k < LEVELS.length; k++) if (xp >= LEVELS[k].min) i = k;
  const cur = LEVELS[i], next = LEVELS[i + 1] || null;
  const span = next ? next.min - cur.min : 1;
  const pctToNext = next ? Math.max(0, Math.min(100, Math.round(((xp - cur.min) / span) * 100))) : 100;
  return { index: i, number: i + 1, title: cur.title, icon: cur.icon, next: next, pctToNext: pctToNext, xpToNext: next ? Math.max(0, next.min - xp) : 0 };
}

const BADGE_DEFS = [
  { id: 'eye', label: 'دقة الملاحظة', desc: 'اكتشاف المشاكل قبل ما تكبر', icon: 'eye' },
  { id: 'integrity', label: 'الأمانة المهنية', desc: 'الإبلاغ عن الخطأ حتى لو محدش لاحظه', icon: 'shield' },
  { id: 'steady', label: 'ثابت تحت الضغط', desc: 'قرارات سليمة في المواقف المؤقّتة', icon: 'gauge' },
  { id: 'priorities', label: 'خبير الأولويات', desc: 'بيرتّب أولوياته صح في كل مرة', icon: 'layers' },
  { id: 'team', label: 'روح الفريق', desc: 'المساعدة في المسموح وقت الضغط', icon: 'users' },
  { id: 'communicator', label: 'محترف التواصل', desc: 'أفضل رد في محاكاة المرضى', icon: 'chat' },
  { id: 'solver', label: 'حلّال المشاكل', desc: 'مواقف غير مألوفة خارج نص الدليل', icon: 'lamp' },
  { id: 'limits', label: 'حدود الصلاحية', desc: 'تصعيد صحيح للمستوى الصحيح', icon: 'branch' },
  { id: 'owner', label: 'تحمّل المسؤولية', desc: 'المتابعة حتى الإغلاق أو التسليم', icon: 'target' }
];
const badgeById = id => BADGE_DEFS.filter(b => b.id === id)[0];

function earnedBadges(answers, d) {
  const out = [];
  const ok = a => a.finalQuality === 'approved' && !a.criticalFailure;
  const ratio = (rows) => rows.length ? rows.filter(ok).length / rows.length : 0;
  const withP = p => answers.filter(a => a.principles.indexOf(p) >= 0);
  const byCat = c => answers.filter(a => a.category === c);

  const spots = answers.filter(a => a.scenarioId.indexOf('hotspot') >= 0);
  if (spots.length >= 1 && ratio(spots) >= 0.75) out.push('eye');
  const hon = withP('honesty'); if (hon.length >= 2 && ratio(hon) === 1) out.push('integrity');
  const tm = answers.filter(a => a.targetSeconds); if (tm.length >= 2 && ratio(tm) >= 0.75) out.push('steady');
  const pr = byCat('prioritization'); if (pr.length >= 2 && ratio(pr) >= 0.75) out.push('priorities');
  const te = withP('teamwork'); if (te.length >= 2 && ratio(te) >= 0.8) out.push('team');
  const co = byCat('communication'); if (co.length >= 3 && ratio(co) >= 0.8) out.push('communicator');
  const ps = byCat('problemSolving'); if (ps.length >= 2 && ratio(ps) >= 0.75) out.push('solver');
  const au = withP('authorityLimits'); if (au.length >= 3 && ratio(au) >= 0.85) out.push('limits');
  const ow = withP('taskOwnership'); if (ow.length >= 2 && ratio(ow) === 1) out.push('owner');

  return d.consistency < 60 ? out.filter(b => b !== 'integrity') : out;
}

/* ── grading ──────────────────────────────────────────────────────────────── */
function gradeChoice(sc, ids) {
  const opts = sc.options || [];
  const chosen = opts.filter(o => ids.indexOf(o.id) >= 0);
  if (!chosen.length) return { quality: 'weak', criticalFailure: false, answerText: '—', feedback: 'لسه ما اخترتش.' };

  if (sc.multiSelect) {
    const correct = opts.filter(o => o.quality === 'approved');
    const hits = chosen.filter(o => o.quality === 'approved').length;
    const miss = chosen.filter(o => o.quality !== 'approved');
    const crit = miss.some(o => o.criticalFailure);
    const acc = correct.length ? Math.max(0, (hits - miss.length * 0.5) / correct.length) : 0;
    const q = crit ? 'unsafe' : acc >= 0.99 ? 'approved' : acc >= 0.6 ? 'partial' : acc > 0 ? 'weak' : 'unsafe';
    return {
      quality: q, criticalFailure: crit,
      answerText: chosen.map(o => o.text).join(' · '),
      feedback: miss.length
        ? 'اخترت ' + hits + ' من ' + correct.length + ' صح، ومعاهم ' + miss.length + ' مش في محلهم. ' + (miss[0] ? miss[0].feedback : '')
        : (hits === correct.length ? 'غطّيت كل النقاط المطلوبة.' : 'فاتك ' + (correct.length - hits) + ' من النقاط المطلوبة.')
    };
  }
  const o = chosen[0];
  return { quality: o.quality, criticalFailure: !!o.criticalFailure, answerText: o.text, feedback: o.feedback, reaction: o.reaction };
}

function gradeOrdering(correct, submitted, labels) {
  const n = correct.length;
  if (!n) return { quality: 'weak', criticalFailure: false, answerText: '—', feedback: '—' };
  let disp = 0;
  submitted.forEach((id, i) => {
    const t = correct.indexOf(id);
    disp += t < 0 ? n : Math.abs(t - i);
  });
  const worst = Math.floor((n * n) / 2) || 1;
  const acc = Math.max(0, 1 - disp / worst);
  const topMissed = correct[0] !== submitted[0];
  const q = acc >= 0.95 ? 'approved' : acc >= 0.7 ? 'partial' : acc >= 0.4 ? 'weak' : 'unsafe';
  return {
    quality: q, criticalFailure: false,
    answerText: submitted.map((id, i) => (i + 1) + '. ' + (labels[id] || id)).join(' | '),
    feedback: acc >= 0.95 ? 'ترتيبك مطابق للترتيب الصح بالظبط.'
      : topMissed ? 'الترتيب قريب، لكن العنصر الأعلى أولوية مش في مكانه — وده الجزء اللي بيفرق فعلًا.'
      : 'الفكرة العامة قريبة، بس فيه عناصر مكانها اتبدّل. شوف الترتيب الصح تحت.'
  };
}

function gradeMatch(pairs, ans) {
  const hits = pairs.filter(p => ans[p.id] === p.right).length;
  const acc = pairs.length ? hits / pairs.length : 0;
  const q = acc >= 0.99 ? 'approved' : acc >= 0.7 ? 'partial' : acc >= 0.4 ? 'weak' : 'unsafe';
  return {
    quality: q, criticalFailure: false,
    answerText: pairs.map(p => p.left + ' ← ' + (ans[p.id] || '—')).join(' | '),
    feedback: hits === pairs.length ? 'كل التوصيلات في محلها.' : hits + ' من ' + pairs.length + ' في محلهم.'
  };
}

function gradeHotspot(sc, found, falseClicks) {
  const spots = (sc.scene && sc.scene.hotspots) || [];
  const f = spots.filter(s => found.indexOf(s.id) >= 0);
  const acc = spots.length ? Math.max(0, (f.length - falseClicks * 0.4) / spots.length) : 0;
  const q = acc >= 0.99 ? 'approved' : acc >= 0.6 ? 'partial' : acc > 0 ? 'weak' : 'unsafe';
  return {
    quality: q, criticalFailure: false,
    answerText: 'حدّد ' + arNum(f.length) + ' من ' + arNum(spots.length) +
      (falseClicks ? ' · واختار ' + countThings(falseClicks) + ' سليمة' : ''),
    feedback: (f.length === spots.length ? 'حدّدت كل المخالفات صح.' : 'حدّدت ' + arNum(f.length) + ' من ' + arNum(spots.length) + ' مخالفات.') +
      (falseClicks ? ' وكمان اخترت ' + countThings(falseClicks) + ' وضعها سليم — شوف التفاصيل تحت.' : (f.length === spots.length ? '' : ' شوف اللي فاتك تحت.'))
  };
}

/* ── reading a written answer ───────────────────────────────────────────────
   People type the way people type: no hamzas, ه instead of ة, ي instead of ى, and
   verbs carrying prefixes and Egyptian negation (هستخدمها، وأسجل، متستخدمهاش).
   Matching raw substrings against a fixed word list marked those answers wrong even
   when they said exactly the right thing — "اكلم الصيانه" missed "الصيانة" by one
   letter and lost the whole family. Both sides are folded and stemmed before they
   are compared, so an answer is judged on what it says, not on how it's spelled. */
const arFold = (s) => String(s == null ? '' : s)
  .replace(/[\u064B-\u065F\u0670\u0640]/g, '')
  .replace(/[أإآٱ]/g, 'ا')
  .replace(/ى/g, 'ي')
  .replace(/ة/g, 'ه')
  .replace(/ؤ/g, 'و')
  .replace(/ئ/g, 'ي')
  .replace(/[^\u0621-\u064Aa-zA-Z0-9\s]/g, ' ')
  .replace(/\s+/g, ' ')
  .trim();

const arStem = (w) => {
  let x = w;
  if (x.length > 4) x = x.replace(/^(وال|فال|بال|كال|لل|ال)/, '');
  if (x.length > 3) x = x.replace(/^(و|ف|ب|ك|ل|س|ه)/, '');
  if (x.length > 3) x = x.replace(/^(ا|ي|ت|ن)/, '');
  for (let i = 0; i < 2; i++) {
    if (x.length > 3) x = x.replace(/(وا|ون|ين|ات|هما|هم|ها|كم|نا|ني|ش|ه|ي|ك)$/, '');
  }
  return x;
};

function arStems(folded) {
  const set = {};
  folded.split(' ').forEach(w => { if (w.length > 1) { set[arStem(w)] = 1; set[w] = 1; } });
  return set;
}

// "مش هبلّغ حد" must not count as reporting. A match only counts if the words just
// before it aren't negating it — unless the keyword itself is the negative phrase
// (the "don't fix it yourself" family is written that way on purpose).
const AR_NEG = { 'مش': 1, 'ما': 1, 'لا': 1, 'ولا': 1, 'بدون': 1, 'غير': 1, 'مفيش': 1, 'هبطل': 1 };
function negatedAt(tokens, i) {
  for (let k = Math.max(0, i - 2); k < i; k++) if (AR_NEG[tokens[k]]) return true;
  return false;
}

function arHas(folded, stems, phrase, tokens) {
  const p = arFold(phrase);
  if (!p) return false;
  const pw = p.split(' ').filter(Boolean);
  const selfNegated = pw.some(w => AR_NEG[w]);

  // run of consecutive tokens equal to the phrase
  for (let i = 0; i + pw.length <= tokens.length; i++) {
    let ok = true;
    for (let j = 0; j < pw.length; j++) if (tokens[i + j] !== pw[j]) { ok = false; break; }
    if (ok && (selfNegated || !negatedAt(tokens, i))) return true;
  }

  const words = pw.filter(w => w.length > 2);
  if (!words.length) return false;
  return words.every(w => {
    const st = arStem(w);
    if (st.length < 3) return folded.indexOf(w) >= 0;
    if (!stems[st]) return false;
    if (selfNegated) return true;
    for (let i = 0; i < tokens.length; i++) {
      if (tokens[i] === w || arStem(tokens[i]) === st) { if (!negatedAt(tokens, i)) return true; }
    }
    return false;
  });
}

function gradeShort(sc, text) {
  const spec = sc.shortAnswer;
  if (!spec) return { quality: 'partial', criticalFailure: false, answerText: text, feedback: '—' };
  const folded = arFold(text);
  const stems = arStems(folded);
  const tokens = folded.split(' ').filter(Boolean);
  const fams = spec.expectedKeywords || [];
  const total = fams.reduce((s, k) => s + k.weight, 0);
  const hit = [], missed = [];
  let matched = 0;
  fams.forEach(f => {
    if (f.any.some(w => arHas(folded, stems, w, tokens))) { matched += f.weight; hit.push(f); }
    else missed.push(f);
  });
  const acc = total ? matched / total : 0;

  // The heaviest family is the point of the question. Someone who got that plus a
  // reasonable share of the rest has answered soundly, even if they phrased the
  // remaining steps in words nobody put on the list.
  const topWeight = fams.reduce((m, f) => Math.max(m, f.weight), 0);
  const gotTop = hit.some(f => f.weight === topWeight);
  const q = (acc >= 0.7 || (gotTop && acc >= 0.6)) ? 'approved'
    : (acc >= 0.35 || (gotTop && acc >= 0.25)) ? 'partial'
    : 'weak';

  return {
    quality: q, criticalFailure: false, answerText: text,
    feedback: q === 'approved' ? 'إجابتك غطّت النقاط الأساسية صح.'
      : q === 'partial' ? 'إجابتك فيها جزء مهم، بس ناقصها نقطة أو اتنين. شوف الرد النموذجي تحت.'
      : 'إجابتك بعيدة شوية عن الفكرة المطلوبة. شوف الرد النموذجي تحت وقارنه بإجابتك.'
  };
}

const ESC_LABEL = {
  self: 'أتصرف بنفسي', senior: 'الموظف الأقدم', systemSupport: 'الدعم داخل النظام',
  manager: 'المدير المباشر', drYoussef: 'د. يوسف', emergency: 'الطبيب الموجود فورًا (طوارئ)'
};
function gradeEsc(sc, id) {
  const c = (sc.escalationChoices || []).filter(x => x.id === id)[0];
  if (!c) return { quality: 'weak', criticalFailure: false, answerText: '—', feedback: 'لسه ما اخترتش.' };
  return { quality: c.quality, criticalFailure: !!c.criticalFailure, answerText: ESC_LABEL[c.level] || c.level, feedback: c.feedback };
}

/* ── ordering keys ────────────────────────────────────────────────────────── */
function orderKey(sc) {
  if (sc.rankingItems && sc.rankingItems.length) {
    return sc.rankingItems.slice().sort((a, b) => a.correctRank - b.correctRank).map(i => i.id);
  }
  if (sc.sequenceSteps && sc.sequenceSteps.length) {
    return sc.sequenceSteps.slice().sort((a, b) => a.correctOrder - b.correctOrder).map(s => s.id);
  }
  return [];
}
/* ── what the right answer actually WAS ────────────────────────────────────
   `principle` is the rule behind the answer; this is the answer itself, in the
   same words the trainee saw on screen. Every summary that tells someone they
   got a scenario wrong has to show both — the rule alone leaves them guessing
   which option they should have picked. */
function correctAnswerParts(sc) {
  if (!sc) return [];
  const ids = Array.isArray(sc.approved) ? sc.approved : [sc.approved];

  if (sc.render === 'escalation') {
    const c = (sc.escalationChoices || []).filter(x => ids.indexOf(x.id) >= 0)[0];
    return c ? [ESC_LABEL[c.level] || c.level] : [];
  }
  if (sc.render === 'sequence' || sc.render === 'ranking') {
    const src = (sc.rankingItems && sc.rankingItems.length) ? sc.rankingItems : (sc.sequenceSteps || []);
    const byId = {};
    src.forEach(i => { byId[i.id] = i.text; });
    return orderKey(sc).map((id, i) => (i + 1) + '. ' + (byId[id] || id));
  }
  if (sc.render === 'match') {
    return (sc.matchPairs || []).map(p => p.left + ' ← ' + p.right);
  }
  if (sc.render === 'hotspot') {
    return ((sc.scene && sc.scene.hotspots) || []).map(h => h.label);
  }
  if (sc.render === 'shortAnswer' && sc.shortAnswer) {
    return (sc.shortAnswer.modelThinking || []).slice();
  }

  // choice / chat / branching — the approved option in its own words. For a
  // branching scenario the second step matters as much as the first, so both
  // halves of the right path are shown the way the trainee walked them.
  const picked = (sc.options || []).filter(o => ids.indexOf(o.id) >= 0).map(o => o.text);
  if (sc.render === 'branching' && sc.branches && ids[0] && sc.branches[ids[0]]) {
    const nxt = (sc.branches[ids[0]].options || []).filter(o => o.quality === 'approved')[0];
    if (nxt) return picked.concat(['وبعدها: ' + nxt.text]);
  }
  return picked;
}

// Single-line form, for places that can only take a sentence (the report table).
function correctAnswerText(sc) {
  return correctAnswerParts(sc).join(' · ');
}

function startOrder(sc) {
  const src = (sc.rankingItems && sc.rankingItems.length)
    ? sc.rankingItems.map(i => ({ id: i.id, text: i.text, hint: i.hint }))
    : (sc.sequenceSteps || []).map(s => ({ id: s.id, text: s.text }));
  if (src.length < 2) return src;
  const correct = orderKey(sc).join('|');
  const reversed = orderKey(sc).slice().reverse().join('|');
  const r = rng('order:' + sc.id);
  for (let i = 0; i < 12; i++) {
    const c = shuffle(src, r);
    const key = c.map(x => x.id).join('|');
    // Never start on the answer, and never on its exact reverse — otherwise
    // employees learn "just flip it" instead of the priority rule.
    if (key !== correct && key !== reversed) return c;
  }
  return shuffle(src, r);
}

/* ── assessment plan ──────────────────────────────────────────────────────── */
const ASSESSMENT_LEN = 20;
function planAssessment(seed) {
  const r = rng(seed + ':plan');
  const groups = {};
  DATA.assessment.forEach(s => { (groups[s.category] = groups[s.category] || []).push(s); });
  Object.keys(groups).forEach(k => { groups[k] = shuffle(groups[k], r); });
  const keys = shuffle(Object.keys(groups), r);
  const picked = [];
  let exhausted = false;
  while (picked.length < ASSESSMENT_LEN && !exhausted) {
    exhausted = true;
    for (let i = 0; i < keys.length; i++) {
      if (picked.length >= ASSESSMENT_LEN) break;
      const next = groups[keys[i]].shift();
      if (next) { picked.push(next); exhausted = false; }
    }
  }
  return picked.sort((a, b) => a.difficulty - b.difficulty).map(s => s.id);
}

/* ── the attempt archive ────────────────────────────────────────────────────
   Every finished session is kept on this device so a second attempt can be read
   against the first: same person, same seven units, and the difference between
   them is the only honest measure of whether the training moved anything.
   Starting a new journey clears the live session, never the archive. */
const HIST_KEY = 'sami-history-v1';
const HIST_MAX = 20;

function historyAll() {
  try { const raw = localStorage.getItem(HIST_KEY); return raw ? JSON.parse(raw) : []; }
  catch (e) { return []; }
}
/** Same person = same phone if given, otherwise the same full name. */
function historyFor(emp) {
  if (!emp) return [];
  const phone = (emp.phone || '').replace(/\D/g, '');
  const name = (emp.fullName || '').trim();
  return historyAll().filter(h => phone && (h.employee.phone || '').replace(/\D/g, '')
    ? (h.employee.phone || '').replace(/\D/g, '') === phone
    : (h.employee.fullName || '').trim() === name);
}
function historySave(rep) {
  try {
    const all = historyAll();
    if (all.some(h => h.session.sessionId === rep.session.sessionId)) return;
    all.unshift(rep);
    // Oldest first out of the door; the archive is a convenience, not a database.
    localStorage.setItem(HIST_KEY, JSON.stringify(all.slice(0, HIST_MAX)));
  } catch (e) { /* quota or private mode — the session itself still works */ }
}

const fmtClock = (m) => {
  const h = Math.floor(m / 60), mm = m % 60;
  return h ? arNum(h) + 'س ' + arNum(mm) + 'د' : arNum(mm) + 'د';
};

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg; t.setAttribute('role', 'status');
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; }, 2200);
  setTimeout(() => t.remove(), 2600);
}

function flyXp(amount, anchor) {
  if (!amount) return;
  const el = document.createElement('div');
  el.className = 'xp-fly'; el.textContent = '+' + amount + ' XP';
  const r = anchor ? anchor.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight / 2, width: 0 };
  el.style.left = (r.left + r.width / 2) + 'px';
  el.style.top = (r.top - 6) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1200);
}

function hud(opts) {
  const segs = [];
  for (let i = 0; i < opts.total; i++) {
    const cls = i < opts.step - 1 ? (opts.marks && opts.marks[i] === 'miss' ? 'seg miss' : 'seg done')
      : i === opts.step - 1 ? 'seg now' : 'seg';
    segs.push('<div class="' + cls + '"><i></i></div>');
  }
  return '<div class="hud"><div class="hud-in">' +
    '<div class="hud-row">' +
      (opts.onBack ? '<button class="hud-back" data-act="hudback" aria-label="رجوع">' + ICON.back + '</button>' : '') +
      '<div class="hud-title">' + esc(opts.title) + (opts.sub ? '<small>' + esc(opts.sub) + '</small>' : '') + '</div>' +
      '<div class="hud-stats">' +
        '<span class="stat clock">' + ICON.clock + ' <span class="mono">' + fmtClock(S.clock) + '</span></span>' +
        (S.streak >= 2 ? '<span class="stat streak' + (S.streak >= 3 ? ' hot' : '') + '">' + ICON.flame + ' <span class="mono">' + S.streak + '</span></span>' : '') +
        '<span class="stat xp" id="xpAnchor">' + ICON.star + ' <span class="mono">' + S.xp + '</span><span class="mono" style="opacity:.55;font-size:.68rem"> · L' + levelFor(S.xp).number + '</span></span>' +
      '</div>' +
    '</div>' +
    '<div class="segs">' + segs.join('') + '</div>' +
  '</div></div>';
}
