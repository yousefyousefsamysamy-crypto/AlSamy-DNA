/* ── فيديو الوحدة ───────────────────────────────────────────────────────────
   Optional, and deliberately the *last* thing in a unit: the trainee works every
   scenario and sees where he stood before he watches anyone do it. A clip at the
   top of a unit quietly converts practice into viewing, which is the one thing
   this program exists not to be.

   Links live in window.SAMI_VIDEOS at the top of the HTML file so the owner can
   paste one in and re-upload without a rebuild. A unit with no link renders no
   video block at all, and a link that fails to load costs the unit nothing. */

/* Accepts what a person would actually copy out of the address bar — a YouTube
   watch/share/shorts link, a Drive share link, a Vimeo link, or a plain file
   path sitting next to the page — and returns the form that embeds. */
function videoSrc(url) {
  const u = String(url == null ? '' : url).trim();
  if (!u) return null;

  const yt = u.match(/(?:youtube\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
  // youtube-nocookie is YouTube's own privacy-enhanced host: same player, no
  // tracking cookie until the trainee actually plays. rel=0 keeps whatever
  // shows at the end limited to the clinic's own channel.
  if (yt) return { kind: 'frame', id: yt[1], orig: u,
    src: 'https://www.youtube-nocookie.com/embed/' + yt[1] + '?rel=0&playsinline=1&cc_load_policy=1',
    poster: 'https://i.ytimg.com/vi/' + yt[1] + '/hqdefault.jpg' };

  // Drive only embeds through its own /preview player; the direct-download form
  // is throttled and breaks without warning.
  const gd = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:[^#]*&)?id=)([A-Za-z0-9_-]{10,})/);
  if (gd) return { kind: 'frame', orig: u, src: 'https://drive.google.com/file/d/' + gd[1] + '/preview', poster: '' };

  const vm = u.match(/(?:player\.)?vimeo\.com\/(?:video\/)?(\d+)/);
  if (vm) return { kind: 'frame', orig: u, src: 'https://player.vimeo.com/video/' + vm[1], poster: '' };

  if (/\.(mp4|webm|ogv|ogg|m4v|mov)(\?|#|$)/i.test(u)) return { kind: 'file', orig: u, src: u, poster: '' };

  return { kind: 'frame', orig: u, src: u, poster: '' };  // already an embed url
}

  const rows = S.answers.filter(a => a.moduleId === m.id && !a.superseded && !a.manualGrade);

            : 'كل مواقف الوحدة دي جبتها صح. خلّي بالك من القاعدة اللي فوق وانت ماشي.') +

/* ═══════════════════════════════════════════════════════════════════════════
   SCENARIO RUNNER
   The eight-beat cycle: See → Think → Decide → Justify → Act → Recover →
   Learn → Apply. The employee never gets the right answer first.
   ═══════════════════════════════════════════════════════════════════════════ */
let RUN = null;

function runScenario(sc, phase, onDone) {
  const mods = sc.modifiers || [];
  const person = PEOPLE[sc.id] || null;

  RUN = {
    sc, phase, onDone, mods, person,
    stage: (mods.indexOf('thinking') >= 0 && sc.thinkingPrompt) ? 'think' : 'answer',
    mood: person ? person.mood : null,
    picked: [], order: startOrder(sc), match: {}, text: '',
    found: [], decoyPicks: [], falseClicks: 0, reorders: 0,
    attempts: 1, hints: 0, confidence: null, reasoningSound: null,
    first: null, grade: null,
    branchKey: null, branchPick: [],
    t0: Date.now(), ms: null,
    timerId: null, thinkId: null, remaining: sc.scoring.limitSeconds || null,
    thinkLeft: 5
  };
  paintScenario();
}

function stopTimer() {
  if (RUN && RUN.timerId) { clearInterval(RUN.timerId); RUN.timerId = null; }
}

/* Time spent off the screen isn't thinking time. A phone call, a patient at the
   desk, a switched tab — none of that should count against a response, and the
   countdown on a timed scenario has no business running while nobody can see it.
   Both the elapsed clock and the countdown pause, and pick up where they were. */
let awayAt = null;
document.addEventListener('visibilitychange', function () {
  if (!RUN || RUN.stage === 'reveal') return;
  if (document.hidden) {
    awayAt = Date.now();
    if (RUN.timerId) { stopTimer(); RUN.timerWasRunning = true; }
    if (RUN.thinkId) { clearInterval(RUN.thinkId); RUN.thinkId = null; RUN.thinkWasRunning = true; }
    return;
  }
  if (!awayAt) return;
  const gone = Date.now() - awayAt;
  awayAt = null;
  if (RUN.ms == null) RUN.t0 += gone;
  if (RUN.timerWasRunning) { RUN.timerWasRunning = false; startTimer(); }
  if (RUN.thinkWasRunning) { RUN.thinkWasRunning = false; tickThink(); }
  if (gone > 3000) toast('وقفنا العدّاد وانت بره الشاشة');
});

function elapsed() {
  if (RUN.ms == null) RUN.ms = Date.now() - RUN.t0;
  return RUN.ms;
}

/* ── the scenario shell ───────────────────────────────────────────────────── */
function paintScenario() {
  const r = RUN, sc = r.sc;
  const isTraining = r.phase === 'training';
  const mod = isTraining ? DATA.modules.filter(m => m.id === S.moduleId)[0] : null;
  const total = isTraining ? DATA.training[S.moduleId].length : S.plan.length;
  const step = isTraining ? S.idx + 1 : S.aIdx + 1;

  const marks = S.answers
    .filter(a => isTraining ? a.moduleId === S.moduleId : a.phase === 'assessment')
    .map(a => (a.finalQuality === 'approved' ? 'ok' : 'miss'));

  const chips = [];
  if (sc.scoring.safetyCritical) chips.push('<span class="chip crit">' + ICON.alert + ' سلامة المريض</span>');
  if (r.attempts > 1) chips.push('<span class="chip warn">محاولة تانية</span>');
  if (sc.reviewFlag) chips.push('<span class="chip">تفاصيل غير محددة في الدليل</span>');

  let body = '';
  if (r.stage === 'think') body = viewThinking();
  else if (r.stage === 'answer') body = viewAnswer();
  else if (r.stage === 'reason') body = viewReason();
  else if (r.stage === 'confidence') body = viewConfidence();
  else if (r.stage === 'branch') body = viewBranch();
  else if (r.stage === 'reveal') body = viewReveal();

  app.innerHTML =
    hud({
      title: isTraining ? mod.title : 'القياس',
      sub: isTraining ? ('موقف ' + step + ' من ' + total) : ('موقف ' + step + ' من ' + total),
      total: total, step: step, marks: marks, onBack: isTraining && r.stage === 'answer' && r.attempts === 1
    }) +
    '<main class="stage" style="padding-top:22px"><div class="stack g20">' +
      (chips.length ? '<div style="display:flex;flex-wrap:wrap;gap:8px">' + chips.join('') + '</div>' : '') +
      (r.person ? '<div class="card pad" style="box-shadow:none">' + personCard(r.person, r.mood) + '</div>' : '') +
      (r.stage !== 'reveal' ? '<p class="situation">' + esc(sc.situation) + '</p>' : '') +
      (r.stage === 'answer' && r.mods.indexOf('timer') >= 0 ? viewTimer() : '') +
      body +
    '</div></main>';

  if (r.stage === 'think') tickThink();
  if (r.stage === 'answer') {
    if (r.mods.indexOf('timer') >= 0) startTimer();
    if (sc.render === 'ranking' || sc.render === 'sequence') wireDrag();
    if (sc.render === 'hotspot') wireScene();
  }
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
}

/* ── beat 2: think ────────────────────────────────────────────────────────── */
function viewThinking() {
  const C = 2 * Math.PI * 34;
  return '<div class="thinking">' +
    '<div class="think-ring">' +
      '<svg class="ring" width="80" height="80" viewBox="0 0 80 80">' +
        '<circle cx="40" cy="40" r="34" stroke="var(--line)"/>' +
        '<circle id="thinkArc" cx="40" cy="40" r="34" stroke="var(--teal)" stroke-dasharray="' + C + '" stroke-dashoffset="0"/>' +
      '</svg>' + ICON.brain +
    '</div>' +
    '<p class="think-q">' + esc(RUN.sc.thinkingPrompt) + '</p>' +
    '<p class="tiny muted" id="thinkNote" style="margin-top:14px">خد 5 ثواني تفكر قبل ما تشوف الخيارات</p>' +
    '<div id="thinkBtn" style="margin-top:18px"></div>' +
  '</div>';
}
function tickThink() {
  const C = 2 * Math.PI * 34;
  const arc = $('#thinkArc');
  let left = RUN.thinkLeft;
  if (RUN.thinkId) clearInterval(RUN.thinkId);
  const iv = setInterval(() => {
    left--;
    RUN.thinkLeft = left;
    if (arc) arc.setAttribute('stroke-dashoffset', String(C * (1 - left / 5)));
    const n = $('#thinkNote');
    if (n) n.textContent = left > 0 ? ('خد ' + left + ' ثواني تفكر قبل ما تشوف الخيارات') : 'دلوقتي اختار';
    if (left <= 0) {
      clearInterval(iv); RUN.thinkId = null;
      const b = $('#thinkBtn');
      if (b) b.innerHTML = '<button class="btn btn-primary btn-full" data-act="think-done">جاهز — وريني الخيارات</button>';
    }
  }, 1000);
  RUN.thinkId = iv;
}

/* ── timer ────────────────────────────────────────────────────────────────── */
function viewTimer() {
  const lim = RUN.sc.scoring.limitSeconds || 30;
  const rem = RUN.remaining == null ? lim : RUN.remaining;
  const C = 2 * Math.PI * 19;
  return '<div class="timer" id="timerBox">' +
    '<svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true">' +
      '<circle cx="23" cy="23" r="19" fill="none" stroke="var(--surface-3)" stroke-width="4"/>' +
      '<circle id="tArc" cx="23" cy="23" r="19" fill="none" stroke="var(--teal)" stroke-width="4" stroke-linecap="round" ' +
        'stroke-dasharray="' + C + '" stroke-dashoffset="' + (C * (1 - rem / lim)) + '" transform="rotate(-90 23 23)" style="transition:stroke-dashoffset 1s linear"/>' +
    '</svg>' +
    '<div><div class="timer-n" id="tNum">' + rem + '</div><div class="timer-l">ثانية · السرعة هنا بتفرق فعلًا</div></div>' +
  '</div>';
}
function startTimer() {
  const r = RUN, lim = r.sc.scoring.limitSeconds || 30, C = 2 * Math.PI * 19;
  stopTimer();
  if (r.remaining == null) r.remaining = lim;
  r.timerId = setInterval(() => {
    r.remaining--;
    const n = $('#tNum'), a = $('#tArc'), box = $('#timerBox');
    if (n) n.textContent = Math.max(0, r.remaining);
    if (a) a.setAttribute('stroke-dashoffset', String(C * (1 - Math.max(0, r.remaining) / lim)));
    if (box) box.classList.toggle('urgent', r.remaining <= lim * 0.3);
    if (a && r.remaining <= lim * 0.3) a.setAttribute('stroke', 'var(--crit)');
    if (r.remaining <= 0) {
      stopTimer(); buzz(60);
      // A timeout is recorded as an unanswered weak response — never as a wrong one.
      settle({ quality: 'weak', criticalFailure: false, answerText: 'انتهى الوقت بدون قرار',
        feedback: 'الوقت خلص قبل ما تقرر. في الشغل الحقيقي القرار المتأخر بيبقى قرار برضه — بس بتكلفة.' });
    }
  }, 1000);
}

/* ── beat 3: decide ───────────────────────────────────────────────────────── */
function viewAnswer() {
  const sc = RUN.sc;
  switch (sc.render) {
    case 'chat': return viewChat();
    case 'ranking':
    case 'sequence': return viewOrder();
    case 'match': return viewMatch();
    case 'hotspot': return viewScene();
    case 'escalation': return viewEscalation();
    case 'shortAnswer': return viewShort();
    default: return viewChoices(sc.options, sc.multiSelect, 'submit');
  }
}

function optionsHtml(opts, multi, delay) {
  return opts.map((o, i) =>

/* Pointer-based drag that also works by touch. Keyboard users use the arrows. */
function wireDrag() {
  const list = $('#orderList');
  if (!list) return;
  let dragEl = null, startY = 0, fromIdx = -1;

  list.addEventListener('pointerdown', (e) => {
    const grip = e.target.closest('[data-act="grip"]');
    if (!grip) return;
    dragEl = grip.closest('.ord');
    fromIdx = Array.from(list.children).indexOf(dragEl);
    startY = e.clientY;
    dragEl.classList.add('drag');
    dragEl.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  list.addEventListener('pointermove', (e) => {
    if (!dragEl) return;
    const dy = e.clientY - startY;
    dragEl.style.transform = 'translateY(' + dy + 'px)';
    const h = dragEl.offsetHeight + 9;
    const shift = Math.round(dy / h);
    const target = Math.max(0, Math.min(RUN.order.length - 1, fromIdx + shift));
    if (target !== fromIdx) {
      const cp = RUN.order.slice();
      const [moved] = cp.splice(fromIdx, 1);
      cp.splice(target, 0, moved);
      RUN.order = cp; RUN.reorders++; fromIdx = target; startY = e.clientY;
      dragEl.style.transform = '';
      repaintOrder();
      dragEl = list.children[target];
      dragEl.classList.add('drag');
      try { dragEl.setPointerCapture(e.pointerId); } catch (err) {}
    }
  });

  const end = () => {
    if (!dragEl) return;
    dragEl.style.transform = '';
    dragEl.classList.remove('drag');
    dragEl = null;
    repaintOrder();
  };
  list.addEventListener('pointerup', end);
  list.addEventListener('pointercancel', end);
}

  // picks after any repaint (a hint, a resize) so nothing visually resets.

/* A pick is a pick — tapping the same thing again takes it back. Selection also
   stays deliberately neutral in colour: telling someone mid-exercise that a tap
   was right or wrong hands them the answer while they're still deciding, and
   makes taking a pick back meaningless. The verdict comes after they submit. */
function pickToggle(key) {
  if (!key) return;
  const isSpot = key.slice(0, 5) === 'spot:';
  const val = key.slice(key.indexOf(':') + 1);
  const list = isSpot ? RUN.found : RUN.decoyPicks;
  const at = list.indexOf(val);
  if (at >= 0) { list.splice(at, 1); buzz(10); } else { list.push(val); buzz(15); }
  RUN.falseClicks = RUN.decoyPicks.length;
  paintScenePicks();
}

function paintScenePicks() {
  const all = document.querySelectorAll('[data-pick]');
  for (let i = 0; i < all.length; i++) {
    const el = all[i], key = el.dataset.pick;
    const isSpot = key.slice(0, 5) === 'spot:';
    const val = key.slice(key.indexOf(':') + 1);
    const on = (isSpot ? RUN.found : RUN.decoyPicks).indexOf(val) >= 0;
    el.setAttribute('aria-pressed', on ? 'true' : 'false');
    el.classList.toggle('picked', on);
    if (el.classList.contains('dent-row')) {
      el.style.borderInlineStartColor = on ? 'var(--teal)' : 'transparent';
      el.style.background = on ? 'var(--teal-soft)' : 'var(--surface)';
    }
  }
  const n = RUN.found.length + RUN.decoyPicks.length;
  const c = $('#spotCount');
  if (c) c.textContent = n ? 'اخترت ' + arNum(n) : 'لسه ما اخترتش';
}

  }

    const missed = (sc.scene.hotspots || []).filter(h => r.found.indexOf(h.id) < 0);

  return '<div class="stack g16">' +

      ? '<div class="verdict v-note">' +

      ? '<div style="display:flex;gap:12px;padding:15px 16px;border-radius:var(--r);background:var(--crit-soft);border:1px solid color-mix(in srgb,var(--crit) 28%,transparent)">' +

        '<p class="tiny" style="color:var(--ink-2)">التصرف ده غلط ممنوع خالص في الدليل، مفيش فيه اجتهاد شخصي. اتسجّل في تقرير الجلسة عشان يتراجع معاك.</p></div>'

    '<div class="btn-row ' + (canRetry ? 'side-by-side' : '') + '">' +

    '</div>' +
  '</div>';

/* ── flow control ─────────────────────────────────────────────────────────── */
function submitAnswer() {
  const r = RUN, sc = r.sc;
  let g;
  switch (sc.render) {
    case 'ranking':
    case 'sequence': {
      const labels = {}; r.order.forEach(i => { labels[i.id] = i.text; });
      g = gradeOrdering(orderKey(sc), r.order.map(i => i.id), labels);
      break;
    }
    case 'match': g = gradeMatch(sc.matchPairs || [], r.match); break;
    case 'escalation': g = gradeEsc(sc, r.picked[0]); break;
    case 'shortAnswer': g = gradeShort(sc, r.text); break;
    case 'hotspot': g = gradeHotspot(sc, r.found, r.falseClicks); break;
    default: g = gradeChoice(sc, r.picked);
  }
  settle(g);
}

function settle(g) {
  const r = RUN;
  stopTimer();
  elapsed();
  r.grade = g;
  if (!r.first) r.first = { quality: g.quality, answer: g.answerText };

  // The mood moves before any verdict is shown — consequence, then judgement.
  if (r.person && r.sc.render !== 'shortAnswer') {
    r.mood = g.quality === 'approved' ? (MOOD_UP[r.mood] || r.mood) : (MOOD_DOWN[r.mood] || r.mood);
  }
  if (r.sc.render === 'shortAnswer' || g.quality === 'approved') buzz(18); else buzz([12, 40]);

  if (r.sc.reasoningPrompt && r.attempts === 1) { r.stage = 'reason'; paintScenario(); return; }
  afterReason();
}

function afterReason() {
  const r = RUN;
  if (r.mods.indexOf('confidence') >= 0 && !r.confidence) { r.stage = 'confidence'; paintScenario(); return; }
  const key = r.picked[0];
  if (r.sc.render === 'branching' && key && r.sc.branches && r.sc.branches[key]) {
    r.branchKey = key; r.stage = 'branch'; paintScenario(); return;
  }
  r.stage = 'reveal'; paintScenario();
}

function submitBranch() {
  const r = RUN;
  const node = r.sc.branches[r.branchKey];
  const o = node.options.filter(x => x.id === r.branchPick[0])[0];
  if (!o) return;
  r.grade = {
    quality: o.quality, criticalFailure: !!o.criticalFailure,
    answerText: r.grade.answerText + ' ← ' + o.text, feedback: o.feedback
  };
  if (r.person) r.mood = o.quality === 'approved' ? (MOOD_UP[r.mood] || r.mood) : (MOOD_DOWN[r.mood] || r.mood);
  r.stage = 'reveal'; paintScenario();
}

function retryScenario() {
  const r = RUN;
  r.attempts++; r.picked = []; r.branchKey = null; r.branchPick = [];
  r.order = startOrder(r.sc); r.match = {}; r.text = '';
  r.found = []; r.decoyPicks = []; r.falseClicks = 0;
  r.ms = null; r.t0 = Date.now();
  r.remaining = r.sc.scoring.limitSeconds || null;
  r.stage = 'answer';
  paintScenario();
}

let onbStep = 0;

function openOnboarding() {
  onbStep = 0;

function renderOnboarding() {
  let scrim = document.querySelector('.onb-scrim');
  if (!scrim) {
    scrim = document.createElement('div');
    scrim.className = 'onb-scrim';
    document.body.appendChild(scrim);
    scrim.addEventListener('click', function (e) {
      const el = e.target.closest('[data-act]');
      const act = el && el.dataset.act;
      if (e.target === scrim || act === 'onb-skip') { scrim.remove(); return; }
      if (act === 'onb-next') {
        if (onbStep >= ONB_STEPS.length - 1) { scrim.remove(); return; }
        onbStep++; renderOnboarding();
      } else if (act === 'onb-back') {
        onbStep = Math.max(0, onbStep - 1); renderOnboarding();
      }
    });
  }
  const s = ONB_STEPS[onbStep];
  const last = onbStep === ONB_STEPS.length - 1;
  scrim.innerHTML = '<div class="onb-card">' +
    '<button class="onb-skip" data-act="onb-skip" aria-label="قفل الدليل">✕</button>' +
    '<div class="onb-dots">' + ONB_STEPS.map((x, i) => '<span class="' + (i === onbStep ? 'on' : '') + '"></span>').join('') + '</div>' +
    '<div class="onb-icon">' + s.icon + '</div>' +
    '<div class="onb-eyebrow">' + esc(s.eyebrow) + '</div>' +

      '<button class="btn btn-primary btn-full" data-act="onb-next">' + (last ? 'يلا نبدأ' : 'التالي') + '</button>' +
    '</div>' +
  '</div>';
}

function finishScenario() {
  const r = RUN;
  if (!r || r.done) return;
  r.done = true;
  const sc = r.sc, g = r.grade;
  const first = r.first || { quality: g.quality, answer: g.answerText };
  const recovered = (first.quality === 'weak' || first.quality === 'unsafe') && g.quality === 'approved';

  const base = {
    scenarioId: sc.id, moduleId: sc.module, category: sc.category, principles: sc.principles,
    phase: r.phase,
    firstQuality: first.quality, firstAnswer: first.answer,
    finalQuality: g.quality, finalAnswer: g.answerText,
    attempts: r.attempts, hintsUsed: r.hints,
    retryOffered: r.mods.indexOf('retry') >= 0 && r.phase === 'training',
    recovered: recovered,
    responseMs: elapsed(), targetSeconds: sc.scoring.targetSeconds,
    reorderCount: r.reorders, confidence: r.confidence, reasoningSound: r.reasoningSound,
    criticalFailure: g.criticalFailure, safetyCritical: !!sc.scoring.safetyCritical,
    freeText: sc.render === 'shortAnswer' ? r.text : undefined
  };
  const scored = scoreAnswer(base);
  const rec = Object.assign({}, base, scored);

  S.answers = S.answers.filter(a => a.scenarioId !== rec.scenarioId).concat([rec]);
  const gained = rec.manualGrade ? XP_MANUAL : XP_FOR[rec.finalQuality];
  const prevLevel = levelFor(S.xp).index;
  S.xp += gained;
  const newLevel = levelFor(S.xp);
  S.streak = rec.manualGrade ? S.streak
    : (rec.finalQuality === 'approved' && !rec.criticalFailure) ? S.streak + 1 : 0;
  if (S.streak === 5 || S.streak === 10) toast('🔥 ' + S.streak + ' مواقف صح ورا بعض — كده!');
  S.badges = earnedBadges(S.answers, computeScore(S.answers).diagnostics);
  S.clock += 6 + Math.round((sc.difficulty || 2) * 2);
  save();

  flyXp(gained, $('#xpAnchor'));
  const cb = RUN.onDone;
  RUN = null;
  if (newLevel.index > prevLevel) {
    S.lastLevel = newLevel.index; save();
    setTimeout(cb, gained ? 260 : 0);
    setTimeout(() => celebrateLevelUp(newLevel), 620);
  } else {
    setTimeout(cb, gained ? 260 : 0);
  }
}

function buildReport() {
  const score = computeScore(S.answers);
  const completedAt = new Date().toISOString();
  // Scenarios flagged reviewFlag test a required BEHAVIOUR (report immediately,
  // escalate, don't skip a step) rather than an exact number the manual doesn't
  // specify (a delay policy in minutes, a maintenance vendor's name). That's
  // deliberate content design, not a gap — but it's still useful for whoever
  // reads the report to know which scored answers rest on judgment calls like
  // that, in case the manual gets more specific later.
  const flagged = {};
  S.answers.forEach(a => {
    const s = getScenario(a.scenarioId);
    if (s && s.reviewFlag) flagged[s.title + ' (' + s.manualRef + ')'] = true;
  });
  return {
    employee: S.employee,
    session: {
      sessionId: S.sessionId, startedAt: S.startedAt, completedAt: completedAt,
      durationSeconds: Math.max(0, Math.round((Date.parse(completedAt) - Date.parse(S.startedAt)) / 1000)),
      attemptNumber: historyFor(S.employee).filter(h => h.session.sessionId !== S.sessionId).length + 1,
      appVersion: '1.0.0-prototype', manualVersion: '3.0 · سبتمبر 2026'
    },
    score: score, answers: S.answers, badges: S.badges, contentReviewNotes: Object.keys(flagged)
  };
}

function radarChart(cats) {
  const N = cats.length, R = 74, cx = 100, cy = 96;
  const pt = (i, v) => {
    const a = -Math.PI / 2 + (i * 2 * Math.PI) / N;
    const rr = R * Math.max(0.06, v / 100);
    return [cx + rr * Math.cos(a), cy + rr * Math.sin(a)];
  };
  const outer = (i, mul) => {
    const a = -Math.PI / 2 + (i * 2 * Math.PI) / N;
    return [cx + R * mul * Math.cos(a), cy + R * mul * Math.sin(a)];
  };
  let grid = '';
  [0.25, 0.5, 0.75, 1].forEach(m => {
    const pts = [];
    for (let i = 0; i < N; i++) pts.push(outer(i, m).map(n => n.toFixed(1)).join(','));
    grid += '<polygon points="' + pts.join(' ') + '" fill="none" stroke="var(--line)" stroke-width="1"/>';
  });
  let spokes = '', labels = '';
  for (let i = 0; i < N; i++) {
    const o = outer(i, 1);
    spokes += '<line x1="' + cx + '" y1="' + cy + '" x2="' + o[0].toFixed(1) + '" y2="' + o[1].toFixed(1) + '" stroke="var(--line)" stroke-width="1"/>';
    const l = outer(i, 1.24);
    const anchor = Math.abs(l[0] - cx) < 6 ? 'middle' : (l[0] > cx ? 'start' : 'end');
    labels += '<text x="' + l[0].toFixed(1) + '" y="' + (l[1] + 3).toFixed(1) + '" text-anchor="' + anchor + '">' + esc(cats[i].label) + '</text>';
  }
  const poly = cats.map((c, i) => pt(i, c.percent === null ? 0 : c.percent).map(n => n.toFixed(1)).join(',')).join(' ');
  const dots = cats.map((c, i) => {
    const p = pt(i, c.percent === null ? 0 : c.percent);
    return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3" fill="var(--teal)"/>';
  }).join('');

  return '<svg class="radar" viewBox="0 0 200 200" width="100%" style="max-width:330px" role="img" aria-label="مخطط النتيجة حسب الفئة">' +
    grid + spokes +
    '<polygon points="' + poly + '" fill="var(--teal)" fill-opacity=".22" stroke="var(--teal)" stroke-width="2" stroke-linejoin="round"/>' +
    dots + labels +
  '</svg>';
}

function barColor(p) {
  return p >= 80 ? 'var(--teal)' : p >= 60 ? 'var(--mint)' : p >= 40 ? 'var(--warn)' : 'var(--crit)';

      '<h2 style="font-size:1.02rem;font-weight:600;color:var(--teal-2);margin-bottom:12px">' + (sc.strengths.length ? 'أقوى نقاطك' : 'نقاط القوة') + '</h2>' +
      (sc.strengths.length
        ? '<ul class="listcard">' + sc.strengths.map(s =>
            '<li><span class="dot"></span><span style="color:var(--ink)">' + esc(s) + '</span></li>').join('') + '</ul>'
        : '<p class="tiny" style="color:var(--ink-2)">الجلسة دي مفيهاش فئة وصلت لمستوى نقدر نقول عليه «نقطة قوة» بثقة. ركّز في الحاجات تحت الأول.</p>') +
    '</div>' +

    (sc.developmentAreas.length ? '<div class="card pad-lg">' +
      '<h2 style="font-size:1.02rem;font-weight:600;margin-bottom:12px">3 حاجات لو طوّرتها هتبقى أقوى</h2>' +
      '<ul class="listcard">' + sc.developmentAreas.map(s =>
        '<li><span class="dot" style="background:var(--warn)"></span><span>' + esc(s) + '</span></li>').join('') + '</ul></div>' : '') +

    (function () {
      const newBadges = S.badges.filter(id => S.badgesSeen.indexOf(id) < 0);
      const locked = BADGE_DEFS.filter(b => S.badges.indexOf(b.id) < 0);
      const earnedHtml = S.badges.length
        ? '<div class="badges">' + S.badges.map((id, i) => {
            const b = badgeById(id); if (!b) return '';
            const isNew = newBadges.indexOf(id) >= 0;
            return '<div class="badge' + (isNew ? ' new' : '') + '" style="animation-delay:' + (i * 70) + 'ms">' +
              '<span style="color:' + (isNew ? '#fff' : 'var(--gold)') + '">' + ICON[b.icon] + '</span>' +
              '<b>' + esc(b.label) + '</b><span>' + esc(b.desc) + '</span></div>';
          }).join('') + '</div>'
        : '<p class="tiny muted">لسه معملتش شارة — كل موقف بتحله صح بيقرّبك من أول شارة.</p>';
      const lockedHtml = locked.length
        ? '<div class="badges" style="margin-top:10px">' + locked.map(b =>
            '<div class="badge-locked">' + ICON.lock + '<span>' + esc(b.label) + '</span></div>').join('') + '</div>'
        : '';
      // Newly earned badges only get the celebratory ring once — after this
      // render they're "seen" like any other badge.
      if (newBadges.length) { S.badgesSeen = S.badges.slice(); save(); }
      return '<div class="stack g12">' +
        '<div style="display:flex;justify-content:space-between;align-items:baseline"><h2 style="font-size:1.02rem;font-weight:600">الشارات اللي كسبتها</h2>' +
        '<span class="tiny muted">' + S.badges.length + ' من ' + BADGE_DEFS.length + '</span></div>' +
        earnedHtml + lockedHtml + '</div>';
    })() +

    '<div class="card pad-lg">' +
      '<h2 style="font-size:1.02rem;font-weight:600;margin-bottom:4px">صح فين وغلط فين</h2>' +
      '<p class="tiny muted" style="margin-bottom:14px">' +
        (missedAnswers.length
          ? 'غلطت في ' + missedAnswers.length + ' من ' + (missedAnswers.length + rightAnswers.length) + ' موقف. كل واحد فيهم تحت بالموقف نفسه، واللي اخترته، واللي كان المفروض تعمله.'
          : 'مجبتش أي موقف غلط في القياس. ده مستوى كويس فعلاً — حافظ عليه.') +
      '</p>' +
      (missedAnswers.length ? '<div class="stack g12">' + missedAnswers.map(reviewBlock).join('') + '</div>' : '') +
      (rightAnswers.length ? '<p class="tiny" style="margin-top:' + (missedAnswers.length ? '14px' : '0') + ';color:var(--ink-2);line-height:1.9">' +
        '<b style="color:var(--good)">جبتها صح:</b> ' + rightAnswers.map(esc).join(' · ') + '</p>' : '') +
      (missedPrinciples.length ? '<p class="tiny muted" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line);line-height:1.9">' +
        '<b>القواعد اللي تستاهل تراجعها تاني:</b> ' +
        missedPrinciples.slice(0, 4).map(p => esc((PRINCIPLE_LESSON[p] || p).split(':')[0])).join(' · ') + '.</p>' : '') +
    '</div>' +

    '<hr class="divide">' +

    // Show what's about to leave the room before asking them to send it — the
    // notes first, then the one action that ends the journey.
    // The trainee's last screen has exactly one job now: get the report to
    // management. Anything else here (raw JSON, print, copy) is an owner's tool,
    // not the trainee's, and only made the last step ambiguous.
    // One button. What happens after it depends on whether the result reached
    // the clinic by itself, and the trainee finds that out here rather than
    // being walked through steps he will usually not need.
    '<div id="deliver">' +
      '<div class="stack g16">' +
        '<div class="stack g8">' +
          '<h2 style="font-size:1.05rem;font-weight:600">آخر خطوة — ابعت نتيجتك للإدارة</h2>' +
          '<p class="tiny muted">دوس على الزرار وهنبعتها لوحدنا. لو النت وقع، هنقولك تعمل إيه.</p>' +
        '</div>' +
        '<button class="btn btn-primary btn-full shine" data-act="submit-result">' +
          ICON.check + ' ابعت نتيجتي للإدارة</button>' +
      '</div>' +
    '</div>' +

    '<button class="btn btn-quiet" data-act="reset" style="align-self:center">ابدأ رحلة جديدة</button>' +
  '</div></main>';

  window.__report = rep;
  if (hadNewBadges || sc.band === 'strongFit') {
    setTimeout(() => confettiBurst(hadNewBadges && sc.band === 'strongFit' ? 60 : 38), 300);
  }
}

function metric(label, v) {
  if (v === null || v === undefined) {
    return '<div class="metric"><b style="color:var(--ink-3);font-size:.85em">لسه معندناش بيانات</b><span>' + esc(label) + '</span></div>';
  }
  return '<div class="metric"><b style="color:' + (v >= 80 ? 'var(--teal)' : v >= 60 ? 'var(--ink)' : 'var(--crit)') + '">' + v + '%</b><span>' + esc(label) + '</span></div>';
}

/* ── the report ─────────────────────────────────────────────────────────────
   One markup, two consumers: openOwnerReport() opens it in a window on this
   device (the owner's own door), and lockedReportHtml() seals the same markup
   into the encrypted file the trainee carries. Printing to PDF is left to the
   browser, which does it better than rasterising ever did.

   The order is the order a decision gets made in: what's the verdict, what is it
   based on, where exactly did it go wrong, and what do you do about it. Each
   analysis gets the form its question needs rather than a fifth identical bar
   chart. Colour never carries meaning alone — every mark has its number and its
   word beside it. */
function reportModel(rep) {
  const sc = rep.score, d = sc.diagnostics;
  const allRows = rep.answers.map(a => {
    const s = getScenario(a.scenarioId) || {};
    return {
      a: a, sc: s,
      ok: a.finalQuality === 'approved',
      crit: !!a.criticalFailure,
      diff: s.difficulty || 0,
      target: a.targetSeconds || (s.scoring && s.scoring.targetSeconds) || null,
      secs: Math.round((a.responseMs || 0) / 1000)
    };
  });
  /* Written answers carry no automatic score, so they take part in no figure in
     this report — not the total, not a unit's percentage, not a principle's
     streak. They are listed on their own tab, verbatim, to be read and graded by
     a person against the model answer. */
  const rows = allRows.filter(r => !r.a.manualGrade);
  const written = allRows.filter(r => r.a.manualGrade && !r.a.superseded).map(r => {
    const mod = DATA.modules.filter(m => m.id === r.a.moduleId)[0] || {};
    return {
      title: r.sc.title || r.a.scenarioId,
      unit: mod.title || '',
      phase: r.a.phase === 'assessment' ? 'القياس' : 'التدريب',
      situation: r.sc.situation || '',
      prompt: (r.sc.shortAnswer && r.sc.shortAnswer.prompt) || '',
      answer: (r.a.freeText || r.a.finalAnswer || '').trim(),
      words: (r.a.freeText || '').trim().split(/\s+/).filter(Boolean).length,
      secs: r.secs,
      model: (r.sc.shortAnswer && r.sc.shortAnswer.modelThinking) || [],
      principle: r.sc.principle || '',
      ref: r.sc.manualRef || ''
    };
  });

  const pctOf = (r) => {
    const poss = r.reduce((s, x) => s + x.a.pointsPossible, 0);
    return poss ? Math.round(r.reduce((s, x) => s + x.a.pointsAwarded, 0) / poss * 100) : null;
  };

  const units = DATA.modules.map((m, i) => {
    const all = rows.filter(r => r.a.moduleId === m.id);
    const redone = all.filter(r => r.a.superseded);
    const mine = all.filter(r => !r.a.superseded);
    const beforePct = redone.length ? (function () {
      const poss = redone.reduce((s, x) => s + x.a.pointsPossible, 0);
      return poss ? Math.round(redone.reduce((s, x) => s + x.a.pointsAwarded, 0) / poss * 100) : null;
    })() : null;
    const tr = mine.filter(r => r.a.phase === 'training');
    const ex = mine.filter(r => r.a.phase === 'assessment');
    return {
      redone: redone.length, beforePct: beforePct,
      n: i + 1, id: m.id, title: m.title, subtitle: m.subtitle, ref: m.manualRef,
      rows: mine, total: mine.length, ok: mine.filter(r => r.ok).length,
      train: tr.length, exam: ex.length,
      trainPct: tr.length ? pctOf(tr) : null,
      examPct: ex.length ? pctOf(ex) : null,
      crit: mine.filter(r => r.crit).length,
      pct: pctOf(mine), misses: mine.filter(r => !r.ok)
    };
  }).filter(u => u.total > 0);

  // A rule tested once is an anecdote; tested five times it's a pattern. Each
  // attempt is kept in order so the report can show whether it holds or wobbles.
  const byP = {};
  rows.forEach(r => (r.a.principles || []).forEach(p => (byP[p] = byP[p] || []).push(r)));
  const principles = Object.keys(byP).map(p => ({
    id: p, label: (PRINCIPLE_LESSON[p] || p).split(':')[0],
    seq: byP[p].map(r => r.crit ? 'crit' : r.ok ? 'ok' : 'miss'),
    total: byP[p].length, ok: byP[p].filter(r => r.ok).length, pct: pctOf(byP[p])
  })).sort((a, b) => b.total - a.total);

  const byDiff = [1, 2, 3, 4, 5].map(x => {
    const mine = rows.filter(r => r.diff === x);
    return { d: x, total: mine.length, ok: mine.filter(r => r.ok).length, pct: pctOf(mine) };
  }).filter(x => x.total > 0);

  const conf = rows.filter(r => r.a.confidence);
  const sure = (r) => r.a.confidence === 'confident' || r.a.confidence === 'veryConfident';
  const quad = {
    sureRight: conf.filter(r => sure(r) && r.ok).length,
    sureWrong: conf.filter(r => sure(r) && !r.ok).length,
    unsureRight: conf.filter(r => !sure(r) && r.ok).length,
    unsureWrong: conf.filter(r => !sure(r) && !r.ok).length,
    total: conf.length
  };

  const timed = rows.filter(r => r.target && r.secs);
  const pace = {
    total: timed.length,
    fast: timed.filter(r => r.secs <= r.target * 0.8).length,
    on: timed.filter(r => r.secs > r.target * 0.8 && r.secs <= r.target * 1.25).length,
    slow: timed.filter(r => r.secs > r.target * 1.25).length
  };

  /* ── what to actually do about it ─────────────────────────────────────────
     Fixed rules on the numbers above, ordered by how much they cost if ignored.
     Nothing here is generated language — each line is a threshold that fired. */
  const actions = [];
  if (sc.criticalFlags.length) actions.push({
    lvl: 'crit', t: 'راجع المواقف الحرجة معاه قبل أي شغل منفرد',
    w: sc.criticalFlags.length + ' موقف من النوع ده. دي مواقف الدليل مانع فيها الاجتهاد الشخصي أصلاً.'
  });
  if (d.safety !== null && d.safety < 90) actions.push({
    lvl: 'crit', t: 'تدريب موجّه على سلامة المريض',
    w: 'مؤشر السلامة ' + d.safety + '% — ده أقل من الحد اللي بيسمح بشغل من غير إشراف.'
  });
  if (quad.sureWrong >= 3) actions.push({
    lvl: 'warn', t: 'تصحيح مباشر: بيغلط وهو واثق',
    w: quad.sureWrong + ' مواقف غلط وكان متأكد إنه صح. النوع ده مش بيسأل، فمش هيتصحح لوحده.'
  });
  const weakUnits = units.filter(u => u.pct !== null && u.pct < 60);
  if (weakUnits.length) actions.push({
    lvl: 'warn', t: 'إعادة ' + (weakUnits.length === 1 ? 'وحدة ' + weakUnits[0].title : weakUnits.length + ' وحدات'),
    w: weakUnits.map(u => u.title + ' (' + u.pct + '%)').join(' · ')
  });
  if (d.consistency !== null && d.consistency < 70) actions.push({
    lvl: 'warn', t: 'القاعدة مش ثابتة عنده',
    w: 'ثبات المبدأ ' + d.consistency + '% — بيطبّق القاعدة في موقف وينساها في موقف من نفس النوع. محتاج تكرار في سياقات مختلفة.'
  });
  if (d.responseSpeed !== null && d.responseSpeed < 60) actions.push({
    lvl: 'info', t: 'تمرين على القرار السريع',
    w: 'قراراته مظبوطة بس أبطأ من المطلوب في المواقف اللي عليها وقت.'
  });
  if (!actions.length) actions.push({
    lvl: 'good', t: 'جاهز يشتغل بإشراف عادي',
    w: 'مفيش مؤشر في الجلسة دي بيستدعي تدريب موجّه قبل الشغل.'
  });

  return {
    rows: rows, written: written, units: units, principles: principles, byDiff: byDiff,
    quad: quad, pace: pace, actions: actions,
    miss: rows.filter(r => !r.ok).length,
    gap: sc.overallPercent - PASS_MARK
  };
}

/* One written answer, laid out for judgement rather than for scanning: what was
   asked, what was written (verbatim, wrapping preserved), what we were looking
   for, and a grade strip the reader can actually click. */
const WA_GRADES = ['ممتاز', 'كويس', 'مقبول', 'ضعيف'];

function writtenCard(w, i) {
  return '<div class="wa" data-wa="' + i + '">' +
    '<div class="wa-h"><b>' + esc(w.title) + '</b>' +
      '<span class="tag">' + esc(w.unit) + '</span>' +
      '<span class="tag">' + esc(w.phase) + '</span>' +
      '<span class="mk-meta">' + (w.words ? w.words + ' كلمة · ' : '') + w.secs + ' ثانية</span>' +
    '</div>' +
    (w.situation ? '<p class="wa-q">' + esc(w.situation) + (w.prompt ? '<br><b>المطلوب:</b> ' + esc(w.prompt) : '') + '</p>' : '') +
    '<div class="wa-cols">' +
      '<div class="wa-col wa-said"><span>اللي كتبه بالظبط</span>' +
        (w.answer ? '<p>' + esc(w.answer) + '</p>' : '<p class="wa-empty">ما كتبش حاجة.</p>') +
      '</div>' +
      '<div class="wa-col wa-model"><span>اللي كنا بندوّر عليه</span>' +
        '<ol>' + w.model.map(t => '<li>' + esc(t) + '</li>').join('') + '</ol>' +
      '</div>' +
    '</div>' +
    (w.principle ? '<p class="wa-r"><b>القاعدة:</b> ' + esc(w.principle) +
      (w.ref ? ' <span class="ref">· ' + esc(w.ref) + '</span>' : '') + '</p>' : '') +
    '<div class="wa-grade"><span>تقييمك:</span>' +
      WA_GRADES.map(g => '<button type="button" data-g="' + esc(g) + '">' + esc(g) + '</button>').join('') +
    '</div>' +
  '</div>';
}

function ownerReportMarkup(rep) {
  const sc = rep.score, d = sc.diagnostics, band = BAND[sc.band];
  const M = reportModel(rep);
  const fmt = iso => { try { return new Intl.DateTimeFormat('ar-EG-u-nu-latn', { dateStyle: 'medium', timeStyle: 'short' }).format(new Date(iso)); } catch (e) { return iso; } };

  const grade = (p) => p === null || p === undefined ? { t: 'مفيش قياس', c: 'mute' }
    : p >= 85 ? { t: 'ممتاز', c: 'good' } : p >= 70 ? { t: 'كويس', c: 'good' }
    : p >= 50 ? { t: 'محتاج تدريب', c: 'warn' } : { t: 'ضعيف', c: 'crit' };
  const chip = (g) => '<span class="chip ' + g.c + '">' + esc(g.t) + '</span>';
  const val = (p) => p === null || p === undefined ? '—' : p + '%';

  /* ── the decision, and what it rests on ─────────────────────────────────── */
  const R = 54, C = 2 * Math.PI * R;
  const dial = '<svg viewBox="0 0 132 132" class="dial" aria-hidden="true">' +
    '<circle cx="66" cy="66" r="' + R + '" fill="none" stroke="#EDECE7" stroke-width="12"/>' +
    '<circle cx="66" cy="66" r="' + R + '" fill="none" stroke="#3E6B85" stroke-width="12" stroke-linecap="round" ' +
      'stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C * (1 - sc.overallPercent / 100)).toFixed(1) + '" ' +
      'transform="rotate(-90 66 66)"/>' +
    // the pass mark, drawn on the same scale so the score has something to mean
    '<line x1="66" y1="4" x2="66" y2="20" stroke="#1D2328" stroke-width="2.5" stroke-linecap="round" ' +
      'transform="rotate(' + (PASS_MARK * 3.6) + ' 66 66)"/></svg>';

  const ACT = { crit: ['#FBE7EA', '#96253C'], warn: ['#FAF0DC', '#8A5D12'], info: ['#EFF3F5', '#2C5468'], good: ['#E4F3ED', '#1F6B53'] };

  /* ── forms, each picked for its own question ────────────────────────────── */

  // categories — a ranked comparison against one reference line
  const cats = sc.categories.slice().sort((a, b) => (b.percent === null ? -1 : b.percent) - (a.percent === null ? -1 : a.percent));
  const catRows = cats.map(c =>
    '<div class="row" data-tip="' + esc(c.label + ' — ' + (c.count || 0) + ' مواقف') + '">' +
      '<span class="row-l">' + esc(c.label) + '</span>' +
      '<span class="track"><i style="width:' + (c.percent === null ? 0 : Math.max(c.percent, 1.5)) + '%"></i><u style="inset-inline-end:' + PASS_MARK + '%"></u></span>' +
      '<span class="row-v">' + val(c.percent) + '</span>' + chip(grade(c.percent)) +
    '</div>').join('');

  // units — cards, not a fifth bar list: the count of mistakes is the second signal
  const unitCards = M.units.map(u => {
    const g = grade(u.pct);
    return '<button class="ucard ' + g.c + '" data-jump="u-' + esc(u.id) + '">' +
      '<span class="ucard-n">' + u.n + '</span>' +
      '<span class="ucard-t">' + esc(u.title) + '</span>' +
      '<span class="ucard-v">' + val(u.examPct !== null ? u.examPct : u.trainPct) + '</span>' +
      '<span class="ucard-k">' + (u.examPct !== null ? 'في القياس' : 'في التدريب') + '</span>' +
      '<span class="track sm"><i style="width:' + ((u.examPct !== null ? u.examPct : u.trainPct) || 0) + '%"></i></span>' +
      '<span class="ucard-m">' +
        (u.examPct !== null && u.trainPct !== null ? 'التدريب ' + u.trainPct + '%' : u.total + ' مواقف') +
        (u.crit ? ' · <b class="c">' + u.crit + ' حرج</b>'
          : u.misses.length ? ' · <b class="w">' + u.misses.length + ' للمراجعة</b>'
          : ' · <b class="g">مفيش غلطات</b>') +
      '</span>' +
    '</button>';
  }).join('');

  // principles — every attempt in order, so consistency is something you see
  const prinRows = M.principles.map(p =>
    '<div class="prow">' +
      '<span class="prow-l">' + esc(p.label) + '</span>' +
      '<span class="dots">' + p.seq.map((q, i) =>
        '<i class="' + q + '" data-tip="' + esc('محاولة ' + (i + 1) + ' — ' + (q === 'ok' ? 'مطابق' : q === 'crit' ? 'خطأ حرج' : 'محتاج مراجعة')) + '"></i>').join('') + '</span>' +
      '<span class="prow-v">' + p.ok + '/' + p.total + '</span>' + chip(grade(p.pct)) +
    '</div>').join('');

  // difficulty — columns, because the question is the shape of the curve
  const diffCols = M.byDiff.map(x =>
    '<div class="col" data-tip="' + esc('صعوبة ' + x.d + ' — ' + x.ok + ' صح من ' + x.total + ' موقف') + '">' +
      '<span class="col-v">' + val(x.pct) + '</span>' +
      '<span class="col-b"><i style="height:' + (x.pct === null ? 0 : x.pct) + '%"></i></span>' +
      '<span class="col-l">' + x.d + '</span>' +
      '<span class="col-n">' + x.ok + '/' + x.total + '</span>' +
    '</div>').join('');

  const QC = { approved: 'good', partial: 'warn', weak: 'crit', unsafe: 'crit' };
  const QW = { approved: 'مطابق', partial: 'جزئي', weak: 'ضعيف', unsafe: 'غير آمن' };
  const timeline = M.rows.map((r, i) =>
    '<span class="tl-c ' + (r.crit ? 'crit' : QC[r.a.finalQuality] || 'mute') + '" data-tip="' +
      esc((i + 1) + '. ' + (r.sc.title || '') + ' — ' + (QW[r.a.finalQuality] || '') + (r.crit ? ' (خطأ حرج)' : '') +
      (r.secs ? ' · ' + r.secs + ' ث' : '')) + '"></span>').join('');

  /* ── the evidence ───────────────────────────────────────────────────────── */
  const missBlock = (r) =>
    '<div class="mk" data-q="' + (r.crit ? 'crit' : 'miss') + '" data-ph="' + esc(r.a.phase) + '">' +
      '<div class="mk-h">' +
        '<span class="tag">' + (r.a.phase === 'assessment' ? 'قياس' : 'تدريب') + '</span>' +
        '<b>' + esc(r.sc.title || r.a.scenarioId) + '</b>' +
        (r.crit ? '<span class="chip crit">خطأ حرج</span>' : '') +
        '<span class="mk-meta">' + (r.secs ? r.secs + ' ث' : '') +

   it can be reached from the welcome page without disturbing the journey state. */

  const all = historyAll();

  if (scrim) scrim.remove();
  scrim = document.createElement('div');
  scrim.className = 'onb-scrim hist';

  const fmtD = iso => { try {
    return new Intl.DateTimeFormat('ar-EG-u-nu-latn', { dateStyle: 'medium', timeStyle: 'short' }).format(new Date(iso));
  } catch (e) { return iso; } };

  const groups = {};
  all.forEach(h => {
    const k = (h.employee.phone || h.employee.fullName || '—').trim();
    (groups[k] = groups[k] || []).push(h);
  });

  const list = !all.length
    ? '<p class="tiny muted" style="text-align:center;padding:18px 0">لسه مفيش محاولات محفوظة على الجهاز ده.</p>'
    : Object.keys(groups).map(k => {
        const rows = groups[k];
        const best = Math.max.apply(null, rows.map(r => r.score.overallPercent));
        return '<div style="margin-bottom:16px">' +
          '<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:8px">' +
            '<b style="font-size:.95rem">' + esc(rows[0].employee.fullName) + '</b>' +
            '<span class="tiny muted">' + rows.length + ' محاولة · أعلى نتيجة ' + best + '%</span></div>' +
          rows.map((h, i) => {
            const nxt = rows[i + 1];
            const delta = nxt ? h.score.overallPercent - nxt.score.overallPercent : null;
            return '<button class="hist-row" data-act="hist-open" data-sid="' + esc(h.session.sessionId) + '">' +
              '<span class="hist-v">' + h.score.overallPercent + '%</span>' +
              '<span class="hist-t"><b>' + esc(BAND[h.score.band].ar) + '</b>' +
                '<span>' + esc(fmtD(h.session.completedAt)) + ' · ' +
                  (h.score.criticalFlags.length ? h.score.criticalFlags.length + ' خطأ حرج' : 'مفيش أخطاء حرجة') + '</span></span>' +
              (delta === null ? '<span class="hist-d muted">أول محاولة</span>'
                : '<span class="hist-d" style="color:' + (delta > 0 ? 'var(--good)' : delta === 0 ? 'var(--ink-3)' : 'var(--crit)') + '">' +
                  (delta > 0 ? '+' : '') + delta + '</span>') +
            '</button>';
          }).join('') + '</div>';
      }).join('');

  scrim.innerHTML = '<div class="onb-card" style="max-width:440px;text-align:start">' +
    '<button class="onb-skip" data-act="hist-close" aria-label="قفل">✕</button>' +
    '<h3 class="onb-title" style="text-align:start">سجل المحاولات</h3>' +
    '<p class="onb-body" style="text-align:start;margin-bottom:14px">المحاولات المحفوظة على الجهاز ده. دوس على أي واحدة تفتح تقريرها كامل.</p>' +
    '<div style="max-height:48vh;overflow:auto">' + list + '</div>' +
    '<div class="btn-row"><button class="btn btn-ghost btn-full" data-act="hist-close">تمام</button></div>' +
  '</div>';
  document.body.appendChild(scrim);

  scrim.addEventListener('click', function (e) {
    const el = e.target.closest('[data-act]');
    const act = el && el.dataset.act;
    if (e.target === scrim || act === 'hist-close') { scrim.remove(); return; }
    if (act === 'hist-open') {
      const rep = historyAll().filter(h => h.session.sessionId === el.dataset.sid)[0];
      if (rep) openOwnerReport(rep);
    }
  });
}

function openOwnerReport(fromHistory) {
  const rep = fromHistory || window.__report || buildReport();
  const m = ownerReportMarkup(rep);
  const html = '<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">' +
    '<meta name="viewport" content="width=device-width,initial-scale=1">' +
    '<title>تقرير تقييم عضو فريق — ' + esc(rep.employee.fullName) + '</title><style>' + m.style + '</style></head><body>' +
    m.body + '<scr' + 'ipt>' + m.script + '</scr' + 'ipt></body></html>';

  const w = window.open('', '_blank');
  if (!w) { toast('المتصفح منع فتح نافذة جديدة'); return; }
  w.document.write(html); w.document.close();
}

/* ── delivery ────────────────────────────────────────────────────────────────
   No server in the file itself, so the handoff is: seal the report, download it,
   and open a wa.me deep link with the identifying details already written. The
   trainee attaches the file — no browser lets a page attach a file to WhatsApp
   for you — and cannot open what he is attaching. */
const WHATSAPP_NUMBER = '201010420424';

/* Where a finished session is sent. A relative path means "this same site", so
   on the hosted version it reaches the Pages Function next to the page and no
   configuration is needed; opened as a local file there is no server to reach,
   which the guard below detects rather than hanging on a doomed request.
   Set it to '' to switch the server path off entirely and always hand the
   trainee the locked file instead. */
const REPORT_ENDPOINT = '/api/submit';

const serverReachable = () => !!REPORT_ENDPOINT &&
  (location.protocol === 'http:' || location.protocol === 'https:');

/* Posts the session and the rendered report. Returns whether it actually landed
   — the whole delivery decision turns on this answer, so it is a real result and
   not the fire-and-forget it used to be. A same-origin request can be read; a
   cross-origin one to somebody else's webhook cannot, so that case reports
   success on "the request went out", which is all the browser is told. */
function postReportToServer(rep) {
  if (!serverReachable()) return Promise.resolve(false);
  const sameOrigin = REPORT_ENDPOINT.charAt(0) === '/';
  let doc = '';
  try {
    const m = ownerReportMarkup(rep);
    doc = '<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">' +
      '<meta name="viewport" content="width=device-width,initial-scale=1">' +
      '<title>تقرير تقييم عضو فريق — ' + esc(rep.employee.fullName) + '</title>' +
      '<style>' + m.style + '</style></head><body>' + m.body +
      '<scr' + 'ipt>' + m.script + '</scr' + 'ipt></body></html>';
  } catch (e) { doc = ''; }

  const body = JSON.stringify({ report: rep, html: doc });
  const ctl = typeof AbortController === 'function' ? new AbortController() : null;
  const bail = ctl ? setTimeout(() => ctl.abort(), 20000) : null;

  return fetch(REPORT_ENDPOINT, {
    method: 'POST',
    mode: sameOrigin ? 'same-origin' : 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: body,
    signal: ctl ? ctl.signal : undefined
  }).then(res => {
    if (bail) clearTimeout(bail);
    return sameOrigin ? !!(res && res.ok) : true;
  }).catch(() => { if (bail) clearTimeout(bail); return false; });
}

/* ── the locked report file ──────────────────────────────────────────────────
   What lands in the trainee's Downloads is this: a small page that holds the
   report as ciphertext and will not show a character of it without the
   password. The trainee can send the file; he cannot read it. There is no
   "view source" way around it either — the plaintext is not in the file.

   Layout of the file:
     sealed  — the report's one-time AES key, encrypted to the owner's public key
     body    — the whole interactive report, AES-256-GCM
     REPORT_KEY — the owner's private key, locked with his password
   Opening it runs those three backwards. */
async function lockedReportHtml(rep) {
  const m = ownerReportMarkup(rep);
  const inner = '<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">' +
    '<meta name="viewport" content="width=device-width,initial-scale=1">' +
    '<title>تقرير تقييم عضو فريق — ' + esc(rep.employee.fullName) + '</title>' +
    '<style>' + m.style + '</style></head><body>' + m.body +
    '<scr' + 'ipt>' + m.script + '</scr' + 'ipt></body></html>';

  const enc = await encryptReportDoc(inner);
  const meta = {
    name: rep.employee.fullName, phone: rep.employee.phone || '',
    address: rep.employee.address || '', session: rep.session.sessionId,
    done: rep.session.completedAt, attempt: rep.session.attemptNumber
  };

  const gate =
    "var D={iv:'" + enc.iv + "',body:'" + enc.body + "',sealed:'" + enc.sealed + "'};" +
    "var K={salt:'" + REPORT_KEY.salt + "',iv:'" + REPORT_KEY.iv + "',data:'" + REPORT_KEY.data + "',it:" + REPORT_KEY.it + "};" +
    "var d=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})};" +
    "var f=document.getElementById('f'),p=document.getElementById('p'),e=document.getElementById('e'),b=document.getElementById('b');" +
    "if(!(window.crypto&&window.crypto.subtle)){e.textContent='المتصفح ده مش بيدعم فتح الملف المحمي. افتحه بـ Chrome أو Edge.';e.className='e on';}" +
    "f.addEventListener('submit',function(ev){ev.preventDefault();e.className='e';b.disabled=true;b.textContent='بيفتح…';" +
      "var s=window.crypto.subtle;" +
      "s.importKey('raw',new TextEncoder().encode(p.value),'PBKDF2',false,['deriveKey'])" +
      ".then(function(bk){return s.deriveKey({name:'PBKDF2',salt:d(K.salt),iterations:K.it,hash:'SHA-256'},bk," +
        "{name:'AES-GCM',length:256},false,['decrypt'])})" +
      ".then(function(kek){return s.decrypt({name:'AES-GCM',iv:d(K.iv)},kek,d(K.data))})" +
      ".then(function(pk){return s.importKey('pkcs8',pk,{name:'RSA-OAEP',hash:'SHA-256'},false,['decrypt'])})" +
      ".then(function(priv){return s.decrypt({name:'RSA-OAEP'},priv,d(D.sealed))})" +
      ".then(function(raw){return s.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt'])})" +
      ".then(function(ak){return s.decrypt({name:'AES-GCM',iv:d(D.iv)},ak,d(D.body))})" +
      ".then(function(buf){var html=new TextDecoder().decode(buf);" +
        "document.open();document.write(html);document.close();})" +
      ".catch(function(){e.textContent='الباسورد غلط.';e.className='e on';" +
        "b.disabled=false;b.textContent='افتح التقرير';p.value='';p.focus();});});" +
    "p.focus();";

  return '<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">' +
    '<meta name="viewport" content="width=device-width,initial-scale=1">' +
    '<title>تقرير تقييم عضو فريق — ' + esc(rep.employee.fullName) + '</title><style>' +
    'body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;' +
      'background:#F7F5EF;color:#2C2A25;font-family:system-ui,"Segoe UI",Tahoma,sans-serif}' +
    '.c{width:100%;max-width:400px;background:#fff;border:1px solid #E6E3DA;border-radius:18px;padding:30px 28px;' +
      'box-shadow:0 20px 50px -30px rgba(44,42,37,.45)}' +
    '.k{font-size:11px;letter-spacing:0;color:#8A9199;margin:0 0 6px}' +
    'h1{font-size:19px;font-weight:700;margin:0 0 4px;line-height:1.6}' +
    '.s{font-size:13px;color:#6E767F;margin:0 0 20px;line-height:1.8}' +
    '.m{background:#FAF9F6;border-radius:12px;padding:13px 15px;margin-bottom:20px}' +
    '.m div{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;line-height:2}' +
    '.m span{color:#8A9199}.m b{font-weight:600;text-align:end}' +
    'label{display:block;font-size:12.5px;font-weight:600;margin-bottom:7px}' +
    'input{width:100%;box-sizing:border-box;font:inherit;font-size:15px;padding:12px 14px;border:1px solid #DDE0E3;' +
      'border-radius:11px;background:#fff;text-align:center;letter-spacing:0}' +
    'input:focus{outline:2px solid #3E6B85;outline-offset:1px;border-color:#3E6B85}' +
    'button{width:100%;margin-top:12px;font:inherit;font-size:14.5px;font-weight:600;color:#fff;background:#2F3B45;' +
      'border:0;border-radius:11px;padding:13px;cursor:pointer}' +
    'button:disabled{opacity:.6;cursor:default}' +
    '.e{font-size:12.5px;color:#C43D57;margin:10px 0 0;min-height:1px;display:none}.e.on{display:block}' +
    '.f{font-size:11.5px;color:#9AA0A6;line-height:1.8;margin:18px 0 0;text-align:center}' +
    '</style></head><body><div class="c">' +
      '<p class="k">مركز السامي</p>' +
      '<h1>تقرير تقييم عضو فريق</h1>' +
      '<p class="s">الملف ده محمي. محتاج باسورد الإدارة عشان يتفتح.</p>' +
      '<div class="m">' +
        '<div><span>الاسم</span><b>' + esc(meta.name) + '</b></div>' +
        (meta.phone ? '<div><span>الموبايل</span><b>' + esc(meta.phone) + '</b></div>' : '') +
        (meta.address ? '<div><span>العنوان</span><b>' + esc(meta.address) + '</b></div>' : '') +
        '<div><span>المحاولة</span><b>رقم ' + meta.attempt + '</b></div>' +
        '<div><span>رقم الجلسة</span><b>' + esc(meta.session) + '</b></div>' +
      '</div>' +
      '<form id="f"><label for="p">باسورد الإدارة</label>' +
      '<input id="p" type="password" autocomplete="off" spellcheck="false" dir="ltr">' +
      '<button id="b" type="submit">افتح التقرير</button>' +
      '<p class="e" id="e"></p></form>' +
      '<p class="f">لو الملف ده وصلك بالغلط، من فضلك ابعته للإدارة واحذفه.</p>' +
    '</div><scr' + 'ipt>' + gate + '</scr' + 'ipt></body></html>';
}

/* The report as one portable file — locked. There is deliberately no plaintext
   variant of this: an unprotected copy sitting one function away is how the
   protection quietly stops being true. */
function lockedReportBlob(rep) {
  return lockedReportHtml(rep).then(html => new Blob([html], { type: 'text/html;charset=utf-8' }));
}

function saveBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* The last action of the journey.
   The server is tried first and silently: when it answers, the trainee never
   sees a file, never attaches anything and cannot forget to. Only when there is
   no server to reach — a dead connection, or the page opened from a file — does
   the locked file appear, and then WhatsApp is opened by a second, deliberate
   tap so the browser still treats it as user-initiated and doesn't block it. */
async function submitResult(btn) {
  const rep = window.__report || buildReport();
  const label = btn ? btn.innerHTML : null;
  if (btn) { btn.disabled = true; btn.innerHTML = ICON.loader + ' بنبعت نتيجتك…'; }

  const landed = await postReportToServer(rep);
  if (btn) { btn.disabled = false; btn.innerHTML = label; }

  const host = document.getElementById('deliver');
  if (!host) return;

  if (landed) {
    host.innerHTML =
      '<div class="card pad-lg center stack g12" style="background:var(--good-soft);' +
        'border-color:color-mix(in srgb,var(--good) 30%,transparent)">' +
        '<div style="width:56px;height:56px;margin:0 auto;border-radius:50%;background:var(--good);' +
          'color:#fff;display:grid;place-items:center">' + ICON.check + '</div>' +
        '<h2 style="font-size:1.1rem;font-weight:600;color:var(--good)">تمام — نتيجتك وصلت للإدارة</h2>' +
        '<p class="tiny" style="color:var(--ink-2);line-height:1.9">مش محتاج تعمل حاجة تانية. ' +
          'راجع اللي فوق براحتك، ولو حابب ترجع للمواقف تاني اعملها من غير قلق.</p>' +
      '</div>';
    return;
  }

  // No server reachable. Fall back to the file the trainee carries by hand.
  host.innerHTML =
    '<div class="stack g16">' +
      '<div class="card pad-lg" style="background:var(--warn-soft);' +
        'border-color:color-mix(in srgb,var(--warn) 30%,transparent)">' +
        '<h2 style="font-size:1.02rem;font-weight:600;color:var(--warn);margin-bottom:6px">' +
          'النت مش راضي يبعت دلوقتي</h2>' +
        '<p class="tiny" style="color:var(--ink-2);line-height:1.9">مفيش مشكلة — هننزّل نتيجتك ' +
          'كملف وتبعته للإدارة على واتساب بنفسك. الملف مقفول بباسورد الإدارة فمش هيفتح عندك، ده طبيعي.</p>' +
      '</div>' +
      '<div class="card pad-lg stack g12">' +
        journeyRow('1', 'نزّل ملف نتيجتك', 'ملف واحد، اسمه فيه رقم موبايلك وتاريخ النهارده.') +
        journeyRow('2', 'افتح واتساب الإدارة', 'المحادثة هتفتح جاهزة والرسالة مكتوبة فيها بياناتك.') +
        journeyRow('3', 'ارفق الملف وابعت', 'من علامة المشبك 📎 جوه واتساب، ارفق الملف اللي نزل وابعته.') +
      '</div>' +
      '<button class="btn btn-primary btn-full" data-act="save-locked">' + ICON.download + ' نزّل ملف نتيجتك</button>' +
      '<button class="btn btn-primary btn-full shine" data-act="open-whatsapp" ' +
        'style="background:#25D366;border-color:#25D366">' + ICON.whatsapp + ' افتح واتساب الإدارة</button>' +
    '</div>';
}

/* Split from the WhatsApp tap on purpose: saving is async (the report has to be
   encrypted first) and opening wa.me must stay synchronous inside a tap, so they
   cannot be the same button without one of them breaking. */
async function saveLockedReport(btn) {
  const rep = window.__report || buildReport();
  const label = btn ? btn.innerHTML : null;
  if (btn) { btn.disabled = true; btn.innerHTML = ICON.loader + ' بنجهّز الملف…'; }
  try {
    saveBlob(await lockedReportBlob(rep), lockedFileName(rep));
    toast('الملف اتحمّل — ارفقه في واتساب');
  } catch (e) {
    toast('الملف مش راضي يتولّد على المتصفح ده — جرّب Chrome أو Edge');
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = label; }
  }
}

/* ASCII only, deliberately. Chromium silently discards a non-ASCII value in a
   download attribute and names the file "download" instead — which would land
   every trainee's report in the same WhatsApp thread under the same meaningless
   name, colliding as download(1), download(2). The phone number and the date
   identify the file on their own; the trainee's name is on the gate screen and
   in the WhatsApp message right above the attachment. */
function lockedFileName(rep) {
  const digits = String(rep.employee.phone || '').replace(/[^0-9]/g, '');
  const day = (rep.session.completedAt || new Date().toISOString()).slice(0, 10);
  return 'AlSami-Report-' + (digits || rep.session.sessionId) + '-' + day + '.html';
}

function openWhatsApp() {
  const rep = window.__report || buildReport();
  // Plain text for a URL parameter, not HTML — esc() here would leave literal
  // "&amp;"-style entities in the message. Identification only: the result, the
  // band and every number stay inside the locked file, because the person
  // carrying the message is the person being assessed.
  const when = (function () { try {
    return new Intl.DateTimeFormat('ar-EG-u-nu-latn', { dateStyle: 'medium', timeStyle: 'short' })
      .format(new Date(rep.session.completedAt));
  } catch (e) { return ''; } })();
  const waText = 'تقرير تقييم عضو فريق — مركز السامي\n' +
    'الاسم: ' + rep.employee.fullName + '\n' +
    'الموبايل: ' + (rep.employee.phone || '—') + '\n' +
    'العنوان: ' + (rep.employee.address || '—') + '\n' +
    'التاريخ: ' + when + '\n' +
    'المحاولة: رقم ' + rep.session.attemptNumber + '\n' +
    'رقم الجلسة: ' + rep.session.sessionId + '\n' +
    'مرفق ملف التقرير.';
  window.open('https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(waText), '_blank');
}

function downloadJson() {
  const rep = window.__report || buildReport();
  const blob = new Blob([JSON.stringify(rep, null, 2)], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'تقرير-' + (S.employee.fullName || 'عضو-الفريق') + '-' + S.sessionId + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('اتحمّل التقرير');
}

function copySummary() {
  const rep = window.__report || buildReport();
  const sc = rep.score;
  const txt = [
    'مركز السامي — تقرير تقييم عضو فريق',
    rep.employee.fullName + ' · ' + rep.employee.address,
    'النتيجة: ' + sc.overallPercent + '% — ' + BAND[sc.band].ar,
    'أخطاء حرجة: ' + sc.criticalFlags.length,
    '',
    ...sc.categories.map(c => c.label + ': ' + (c.percent === null ? 'مفيش قياس' : c.percent + '%')),
    '',
    'ملاحظات النظام:',
    ...sc.insights.map(i => '- ' + i),
    '',
    'رقم الجلسة: ' + rep.session.sessionId
  ].join('\n');
  const done = () => toast('اتنسخ الملخص');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done).catch(() => fallbackCopy(txt, done));
  } else fallbackCopy(txt, done);
}
function fallbackCopy(txt, done) {
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { toast('مقدرتش أنسخ'); }
  ta.remove();
}

/* ═══════════════════════════════════════════════════════════════════════════
   ROUTER
   ═══════════════════════════════════════════════════════════════════════════ */
function render() {
  stopTimer();
  // A session can only be past the door if we know whose it is. Storage that got
  // into a half-state (a cleared key, a partial restore) sends the person back to
  // the form instead of to a blank screen.
  if (S.phase !== 'welcome' && S.phase !== 'identity' && !S.employee) {
    S.phase = 'identity'; save();
  }
  switch (S.phase) {
    case 'welcome': return screenWelcome();
    case 'identity': return screenIdentity();
    case 'map': return screenMap();
    case 'module': {
      const list = DATA.training[S.moduleId];
      if (!S.moduleStarted) return screenModuleIntro();
      if (S.idx >= list.length) return screenTakeaway();
      return runScenario(list[S.idx], 'training', () => { S.idx++; save(); render(); });
    }
    case 'bridge': return screenBridge();
    case 'assessment': {
      if (S.aIdx >= S.plan.length) { S.phase = 'results'; save(); return screenResults(); }
      const sc = getScenario(S.plan[S.aIdx]);
      return runScenario(sc, 'assessment', () => { S.aIdx++; save(); render(); });
    }
    case 'results': return screenResults();
    default: return screenWelcome();
  }
}

/* ── one delegated listener for the whole app ─────────────────────────────── */
// Actions that read the live scenario. A double tap on a slow device used to
// reach these after RUN was torn down.
const NEEDS_RUN = ['think-done', 'pick', 'mv', 'spot', 'decoy', 'submit', 'submit-scene',
  'submit-branch', 'reason', 'conf', 'retry', 'continue', 'hint'];

document.addEventListener('click', function (e) {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;
  if (NEEDS_RUN.indexOf(act) >= 0 && !RUN) return;

  switch (act) {
    case 'go-identity': S.phase = 'identity'; save(); render(); break;
    case 'onb-open': openOnboarding(); break;
    case 'open-module':
      S.moduleId = t.dataset.id; S.idx = 0; S.moduleStarted = false; S.phase = 'module'; save(); render(); break;
    case 'start-module': S.moduleStarted = true; save(); render(); break;
    case 'hudback': S.phase = 'map'; S.moduleStarted = false; save(); render(); break;
    case 'play-video': {
      // The facade swaps itself for the real player only on the tap, so the
      // video host is never contacted by someone who didn't ask for it — and a
      // unit whose video is unreachable still closes normally.
      const vsrc = t.dataset.src, vkind = t.dataset.kind;
      const wrap = document.createElement('div');
      wrap.className = 'vid-frame';
      if (vkind === 'file') {
        const vd = document.createElement('video');
        vd.src = vsrc; vd.controls = true; vd.autoplay = true;
        vd.setAttribute('playsinline', '');
        wrap.appendChild(vd);
      } else {
        const fr = document.createElement('iframe');
        fr.src = vsrc + (vsrc.indexOf('?') >= 0 ? '&' : '?') + 'autoplay=1';
        fr.title = t.getAttribute('aria-label') || 'فيديو الوحدة';
        fr.setAttribute('allow', 'accelerometer; autoplay; encrypted-media; picture-in-picture; fullscreen');
        fr.setAttribute('allowfullscreen', '');
        fr.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
        wrap.appendChild(fr);
      }
      t.replaceWith(wrap);
      break;
    }
    case 'redo-module': {
      // The first pass is kept and marked, never deleted: the report still shows
      // it, so choosing to retrain reads as what it is rather than as a gap.
      S.answers.forEach(a => { if (a.moduleId === S.moduleId) a.superseded = true; });
      S.idx = 0; S.moduleStarted = true;
      save(); render(); break;
    }
    case 'finish-module': {
      if (S.completed.indexOf(S.moduleId) < 0) S.completed.push(S.moduleId);
      const remaining = DATA.modules.filter(m => S.completed.indexOf(m.id) < 0);
      S.moduleStarted = false; S.moduleId = null; S.idx = 0;
      S.phase = remaining.length ? 'map' : 'bridge';
      save(); render(); break;
    }
    case 'to-bridge': S.phase = 'bridge'; save(); render(); break;
    case 'start-assessment':
      S.plan = S.plan.length ? S.plan : planAssessment(S.sessionId);
      S.aIdx = 0; S.phase = 'assessment'; save(); render(); break;

    case 'think-done': RUN.stage = 'answer'; RUN.t0 = Date.now(); paintScenario(); break;

    case 'pick': {
      const id = t.dataset.id;
      const inBranch = RUN.stage === 'branch';
      const bag = inBranch ? 'branchPick' : 'picked';
      const multi = !inBranch && RUN.sc.multiSelect;
      if (multi) {
        const i = RUN[bag].indexOf(id);
        if (i >= 0) RUN[bag].splice(i, 1); else RUN[bag].push(id);
      } else RUN[bag] = [id];
      $$('[data-act="pick"]').forEach(b => b.setAttribute('aria-checked', RUN[bag].indexOf(b.dataset.id) >= 0 ? 'true' : 'false'));
      const btn = $('#submitBtn');
      if (btn) btn.disabled = RUN[bag].length === 0;
      buzz(8);
      break;
    }
    case 'mv': { const li = t.closest('.ord'); moveItem(li.dataset.id, Number(t.dataset.dir)); break; }
    case 'spot': case 'decoy': pickToggle(t.dataset.pick); break;
    case 'submit-scene': submitAnswer(); break;
    case 'submit': submitAnswer(); break;
    case 'submit-branch': submitBranch(); break;
    case 'reason': RUN.reasoningSound = t.dataset.sound === '1'; afterReason(); break;
    case 'conf': RUN.confidence = t.dataset.id; afterReason(); break;
    case 'retry': retryScenario(); break;
    case 'continue': finishScenario(); break;
    case 'hint': {
      if (RUN.hints === 0) { RUN.hints++; t.textContent = hintFor(RUN.sc); t.style.color = 'var(--ink-2)'; }
      break;
    }

    case 'dl-json': downloadJson(); break;
    case 'print': openOwnerReport(); break;
    case 'copy': copySummary(); break;
    case 'submit-result': submitResult(t); break;
    case 'save-locked': saveLockedReport(t); break;
    case 'open-whatsapp': openWhatsApp(); break;
    case 'history': openHistory(); break;
    case 'reset':
      if (confirm('هتبدأ من الأول وتقدمك الحالي هيتمسح. متأكد؟')) resetAll();
      break;
  }
});

document.addEventListener('change', function (e) {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  if (t.dataset.act === 'match' && RUN) {
    RUN.match[t.dataset.id] = t.value;
    const need = (RUN.sc.matchPairs || []).length;
    const have = Object.keys(RUN.match).filter(k => RUN.match[k]).length;
    const btn = $('#submitBtn'); if (btn) btn.disabled = have < need;
  }
});

document.addEventListener('input', function (e) {
  if (e.target.id !== 'freeText' || !RUN) return;
  RUN.text = e.target.value;
  const min = RUN.sc.shortAnswer.minChars;
  const left = Math.max(0, min - RUN.text.trim().length);
  const note = $('#charNote');
  if (note) note.textContent = left > 0 ? ('اكتب ' + left + ' حرف كمان على الأقل') : 'إجابتك جاهزة للإرسال';
  const btn = $('#submitBtn'); if (btn) btn.disabled = left > 0;
});

/* ── boot ─────────────────────────────────────────────────────────────────── */
/* Light porcelain theme only, by request — no dark mode, no toggle. */
load();
render();

})();

</script>
</body>
</html>
